<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MagiK Kingdom</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #gameWrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
    }

    canvas {
      display: block;
      background: #1f2937;
      border: 3px solid #d4af37;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas" width="960" height="640"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const TILE = 32;
    const WORLD_COLS = 50;
    const WORLD_ROWS = 40;
    const PLAYER_WIDTH = 42;
    const PLAYER_HEIGHT = 58;

    const camera = { x: 0, y: 0 };

    const keys = { up: false, down: false, left: false, right: false };

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key === "arrowup" || key === "w") keys.up = true;
      if (key === "arrowdown" || key === "s") keys.down = true;
      if (key === "arrowleft" || key === "a") keys.left = true;
      if (key === "arrowright" || key === "d") keys.right = true;
      if (["arrowup","arrowdown","arrowleft","arrowright"," ","w","a","s","d"].includes(key)) {
        event.preventDefault();
      }
    });

    document.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      if (key === "arrowup" || key === "w") keys.up = false;
      if (key === "arrowdown" || key === "s") keys.down = false;
      if (key === "arrowleft" || key === "a") keys.left = false;
      if (key === "arrowright" || key === "d") keys.right = false;
    });

    const map = Array.from({ length: WORLD_ROWS }, () => Array(WORLD_COLS).fill(0));

    function setTile(x, y, value) {
      if (x >= 0 && x < WORLD_COLS && y >= 0 && y < WORLD_ROWS) map[y][x] = value;
    }

    function paintRect(x, y, w, h, value) {
      for (let yy = y; yy < y + h; yy++) {
        for (let xx = x; xx < x + w; xx++) {
          setTile(xx, yy, value);
        }
      }
    }

    function drawHouse(baseX, baseY, width, height) {
      paintRect(baseX - 1, baseY - 2, width + 2, 2, 6);
      paintRect(baseX, baseY, width, height, 2);
      const doorX = baseX + Math.floor((width - 2) / 2);
      const doorY = baseY + height - 1;
      paintRect(doorX, doorY, 2, 1, 7);
      if (width >= 4) {
        setTile(baseX + 1, baseY + 1, 2);
        setTile(baseX + width - 2, baseY + 1, 2);
      }
      setTile(baseX + 1, baseY - 2, 5);
      setTile(baseX + width - 2, baseY - 2, 5);
    }

    function drawFenceSection(startX, startY, length, direction) {
      if (direction === "horizontal") {
        for (let i = 0; i < length; i++) setTile(startX + i, startY, 9);
      } else {
        for (let i = 0; i < length; i++) setTile(startX, startY + i, 9);
      }
    }

    function createVillageMap() {
      for (let y = 0; y < WORLD_ROWS; y++) {
        for (let x = 0; x < WORLD_COLS; x++) map[y][x] = 0;
      }

      paintRect(0, 0, WORLD_COLS, 1, 5);
      paintRect(0, WORLD_ROWS - 1, WORLD_COLS, 1, 5);
      paintRect(0, 0, 1, WORLD_ROWS, 5);
      paintRect(WORLD_COLS - 1, 0, 1, WORLD_ROWS, 5);

      paintRect(0, 18, WORLD_COLS, 3, 1);
      paintRect(15, 0, 3, WORLD_ROWS, 1);
      paintRect(32, 0, 3, WORLD_ROWS, 1);
      paintRect(0, 8, 15, 2, 1);
      paintRect(32, 8, WORLD_COLS - 32, 2, 1);
      paintRect(0, 30, 15, 2, 1);
      paintRect(32, 30, WORLD_COLS - 32, 2, 1);

      for (let i = 0; i < 100; i++) {
        const fx = 2 + Math.floor(Math.random() * (WORLD_COLS - 4));
        const fy = 2 + Math.floor(Math.random() * (WORLD_ROWS - 4));
        if (map[fy][fx] === 0) map[fy][fx] = 4;
      }

      drawHouse(2, 3, 8, 5);
      drawHouse(2, 12, 8, 5);
      drawHouse(11, 3, 8, 5);
      drawHouse(11, 12, 8, 5);
      drawFenceSection(1, 2, 10, "horizontal");
      drawFenceSection(10, 2, 8, "horizontal");
      drawFenceSection(1, 2, 16, "vertical");

      drawHouse(35, 3, 8, 5);
      drawHouse(35, 12, 8, 5);
      drawHouse(44, 3, 5, 5);
      drawHouse(44, 12, 5, 5);
      drawFenceSection(34, 2, 10, "horizontal");
      drawFenceSection(43, 2, 8, "horizontal");

      drawHouse(2, 33, 8, 5);
      drawHouse(11, 33, 8, 5);
      drawFenceSection(1, 32, 10, "horizontal");
      drawFenceSection(10, 32, 8, "horizontal");

      drawHouse(35, 33, 8, 5);
      drawHouse(44, 33, 5, 5);
      drawFenceSection(34, 32, 10, "horizontal");
      drawFenceSection(43, 32, 8, "horizontal");

      const forestAreas = [
        { x: 2, y: 21, w: 10, h: 10 },
        { x: 37, y: 21, w: 10, h: 10 }
      ];
      for (const area of forestAreas) {
        for (let yy = area.y; yy < area.y + area.h; yy++) {
          for (let xx = area.x; xx < area.x + area.w; xx++) {
            if (Math.random() > 0.3) setTile(xx, yy, 8);
          }
        }
      }

      const treeSpots = [
        [20, 5], [25, 5], [30, 5], [20, 35], [25, 35], [30, 35], [40, 23], [42, 27], [45, 30]
      ];
      for (const [tx, ty] of treeSpots) paintRect(tx, ty, 2, 2, 8);

      paintRect(21, 21, 4, 3, 3);
      paintRect(22, 24, 3, 2, 3);
      paintRect(8, 35, 2, 3, 3);
      setTile(16, 16, 10);
      setTile(33, 16, 10);

      const rockPatches = [
        { x: 4, y: 26, w: 2, h: 2 },
        { x: 39, y: 26, w: 2, h: 2 },
        { x: 22, y: 10, w: 2, h: 1 },
        { x: 25, y: 10, w: 2, h: 1 }
      ];
      for (const patch of rockPatches) paintRect(patch.x, patch.y, patch.w, patch.h, 5);

      paintRect(22, 24, 3, 1, 11);
      paintRect(22, 17, 4, 2, 1);
    }

    createVillageMap();

    function isSolidTile(x, y) {
      if (x < 0 || x >= WORLD_COLS || y < 0 || y >= WORLD_ROWS) return true;
      const tile = map[y][x];
      return tile === 2 || tile === 5 || tile === 3 || tile === 6 || tile === 8 || tile === 9;
    }

    const player = {
      x: 24 * TILE + TILE / 2,
      y: 18 * TILE + TILE / 2,
      speed: 140,
      facing: "down",
      walkFrame: 0,
      isWalking: false,
      walkTimer: 0
    };

    function rectIntersectsRect(r1, r2) {
      return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    }

    function isBlockedAtPosition(px, py) {
      const rect = {
        x: px - PLAYER_WIDTH / 2 + 6,
        y: py - PLAYER_HEIGHT / 2 + 6 + 10,
        w: PLAYER_WIDTH - 12,
        h: PLAYER_HEIGHT / 2 - 14
      };

      const left = Math.floor((px - PLAYER_WIDTH / 2) / TILE);
      const right = Math.floor((px + PLAYER_WIDTH / 2) / TILE);
      const top = Math.floor((py - PLAYER_HEIGHT / 2) / TILE);
      const bottom = Math.floor((py + PLAYER_HEIGHT / 2) / TILE);

      for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
          if (isSolidTile(tx, ty)) {
            const tileRect = { x: tx * TILE, y: ty * TILE, w: TILE, h: TILE };
            if (rectIntersectsRect(rect, tileRect)) return true;
          }
        }
      }
      return false;
    }

    function update(dt) {
      let moveX = 0;
      let moveY = 0;

      if (keys.left) moveX = -1;
      if (keys.right) moveX = 1;
      if (keys.up) moveY = -1;
      if (keys.down) moveY = 1;

      if (moveX !== 0 || moveY !== 0) {
        const length = Math.hypot(moveX, moveY) || 1;
        moveX = (moveX / length) * player.speed * dt;
        moveY = (moveY / length) * player.speed * dt;

        if (Math.abs(moveX) > Math.abs(moveY)) {
          if (moveX > 0) player.facing = "right";
          else player.facing = "left";
        } else {
          if (moveY > 0) player.facing = "down";
          else player.facing = "up";
        }

        const newX = player.x + moveX;
        const newY = player.y + moveY;

        player.x = newX;
        if (isBlockedAtPosition(player.x, player.y)) player.x -= moveX;

        player.y = newY;
        if (isBlockedAtPosition(player.x, player.y)) player.y -= moveY;

        player.isWalking = true;
        player.walkTimer += dt;
        if (player.walkTimer > 0.2) {
          player.walkFrame = 1 - player.walkFrame;
          player.walkTimer = 0;
        }
      } else {
        player.isWalking = false;
        player.walkFrame = 0;
        player.walkTimer = 0;
      }

      player.x = Math.max(PLAYER_WIDTH / 2, Math.min(player.x, WORLD_COLS * TILE - PLAYER_WIDTH / 2));
      player.y = Math.max(PLAYER_HEIGHT / 2, Math.min(player.y, WORLD_ROWS * TILE - PLAYER_HEIGHT / 2));

      camera.x = player.x - canvas.width / 2;
      camera.y = player.y - canvas.height / 2;
      camera.x = Math.max(0, Math.min(camera.x, WORLD_COLS * TILE - canvas.width));
      camera.y = Math.max(0, Math.min(camera.y, WORLD_ROWS * TILE - canvas.height));
    }

    function drawTile(x, y, tileType, screenX, screenY) {
      if (tileType === 0) {
        ctx.fillStyle = "#7bc916";
        ctx.fillRect(screenX, screenY, TILE, TILE);
        ctx.fillStyle = "rgba(255,255,255,0.1)";
        ctx.fillRect(screenX + 2, screenY + 6, 2, 3);
        ctx.fillRect(screenX + 8, screenY + 12, 2, 3);
        ctx.fillRect(screenX + 20, screenY + 8, 2, 3);
        ctx.fillStyle = "rgba(0,0,0,0.05)";
        ctx.fillRect(screenX, screenY + TILE - 8, TILE, 8);
      }
      if (tileType === 1) {
        ctx.fillStyle = "#c9a876";
        ctx.fillRect(screenX, screenY, TILE, TILE);
        ctx.strokeStyle = "rgba(100,75,50,0.3)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(screenX + 4, screenY + 10);
        ctx.lineTo(screenX + TILE - 4, screenY + 10);
        ctx.moveTo(screenX + 4, screenY + 20);
        ctx.lineTo(screenX + TILE - 4, screenY + 20);
        ctx.stroke();
      }
      if (tileType === 2) {
        ctx.fillStyle = "#e8d4b8";
        ctx.fillRect(screenX, screenY, TILE, TILE);
        ctx.fillStyle = "#7dd3fc";
        ctx.fillRect(screenX + 4, screenY + 6, 6, 6);
        ctx.fillRect(screenX + 22, screenY + 6, 6, 6);
        ctx.strokeStyle = "rgba(150,120,90,0.4)";
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(screenX, screenY + 16);
        ctx.lineTo(screenX + TILE, screenY + 16);
        ctx.stroke();
      }
      if (tileType === 3) {
        ctx.fillStyle = "#4a90e2";
        ctx.fillRect(screenX, screenY, TILE, TILE);
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.beginPath();
        ctx.moveTo(screenX + 2, screenY + 8);
        ctx.quadraticCurveTo(screenX + 8, screenY + 4, screenX + 14, screenY + 8);
        ctx.quadraticCurveTo(screenX + 20, screenY + 12, screenX + TILE - 2, screenY + 8);
        ctx.fill();
      }
      if (tileType === 4) {
        ctx.fillStyle = "#7bc916";
        ctx.fillRect(screenX, screenY, TILE, TILE);
        ctx.fillStyle = "#ff69b4";
        for (let i = 0; i < 5; i++) {
          const angle = (i / 5) * Math.PI * 2;
          const fx = screenX + TILE / 2 + Math.cos(angle) * 5;
          const fy = screenY + TILE / 2 + Math.sin(angle) * 5;
          ctx.beginPath(); ctx.arc(fx, fy, 2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "#ffff00";
        ctx.beginPath(); ctx.arc(screenX + TILE / 2, screenY + TILE / 2, 1.5, 0, Math.PI * 2); ctx.fill();
      }
      if (tileType === 5) {
        ctx.fillStyle = "#a8a8a8";
        ctx.fillRect(screenX, screenY, TILE, TILE);
        ctx.fillStyle = "#d4d4d4";
        ctx.fillRect(screenX + 3, screenY + 3, TILE - 6, TILE - 6);
        ctx.strokeStyle = "#717171";
        ctx.lineWidth = 1;
        ctx.strokeRect(screenX + 2, screenY + 2, TILE - 4, TILE - 4);
      }
      if (tileType === 6) {
        ctx.fillStyle = "#6b4423";
        ctx.fillRect(screenX, screenY, TILE, TILE);
        ctx.fillStyle = "#8b5a2b";
        for (let i = 0; i < 2; i++) {
          ctx.fillRect(screenX + 4 + i * 12, screenY + 4, 8, 4);
          ctx.fillRect(screenX + 4 + i * 12, screenY + 12, 8, 4);
          ctx.fillRect(screenX + 4 + i * 12, screenY + 20, 8, 4);
        }
      }
      if (tileType === 7) {
        ctx.fillStyle = "#8b4513";
        ctx.fillRect(screenX, screenY, TILE, TILE);
        ctx.fillStyle = "#654321";
        ctx.fillRect(screenX + 2, screenY + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = "#d4af37";
        ctx.beginPath(); ctx.arc(screenX + TILE - 6, screenY + TILE / 2, 2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#654321";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(screenX + TILE / 2, screenY + 3);
        ctx.lineTo(screenX + TILE / 2, screenY + TILE - 3);
        ctx.stroke();
      }
      if (tileType === 8) {
        ctx.fillStyle = "#3a7d44";
        ctx.beginPath();
        ctx.ellipse(screenX + TILE / 2, screenY + TILE / 2, TILE / 2, TILE / 2 + 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(screenX + 6, screenY + 6, 8, 8);
      }
      if (tileType === 9) {
        ctx.fillStyle = "#8b6914";
        ctx.fillRect(screenX + 2, screenY + 6, TILE - 4, 4);
        ctx.fillRect(screenX + 8, screenY + 2, 4, TILE - 4);
        ctx.fillRect(screenX + 20, screenY + 2, 4, TILE - 4);
      }
      if (tileType === 10) {
        ctx.fillStyle = "#8b6914";
        ctx.fillRect(screenX + 12, screenY + 20, 8, 12);
        ctx.fillStyle = "#d4af37";
        ctx.fillRect(screenX + 6, screenY + 4, 20, 12);
        ctx.fillStyle = "#000";
        ctx.font = "8px Arial";
        ctx.fillText("INN", screenX + 10, screenY + 12);
      }
      if (tileType === 11) {
        ctx.fillStyle = "#8b6914";
        ctx.fillRect(screenX, screenY, TILE, TILE);
        ctx.fillStyle = "#a0791a";
        ctx.fillRect(screenX + 2, screenY + 8, TILE - 4, 4);
        ctx.fillRect(screenX + 8, screenY + 2, 4, TILE - 4);
      }
    }

    function drawMap() {
      const startCol = Math.floor(camera.x / TILE);
      const startRow = Math.floor(camera.y / TILE);
      const endCol = Math.ceil((camera.x + canvas.width) / TILE);
      const endRow = Math.ceil((camera.y + canvas.height) / TILE);

      for (let y = startRow; y < endRow; y++) {
        for (let x = startCol; x < endCol; x++) {
          if (x >= 0 && x < WORLD_COLS && y >= 0 && y < WORLD_ROWS) {
            const screenX = x * TILE - camera.x;
            const screenY = y * TILE - camera.y;
            drawTile(x, y, map[y][x], screenX, screenY);
          }
        }
      }
    }

    function drawPlayer() {
      const screenX = player.x - camera.x;
      const screenY = player.y - camera.y;

      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.beginPath();
      ctx.ellipse(screenX, screenY + PLAYER_HEIGHT / 2 - 2, PLAYER_WIDTH / 2 - 2, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      let legOffsetY = 0;
      if (player.isWalking) legOffsetY = player.walkFrame === 0 ? 0 : 2;

      ctx.fillStyle = "rgba(214, 59, 140, 0.9)";
      ctx.beginPath();
      ctx.moveTo(screenX - 16, screenY - 4);
      ctx.lineTo(screenX - 22, screenY + 20);
      ctx.lineTo(screenX + 22, screenY + 20);
      ctx.lineTo(screenX + 16, screenY - 4);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#e6b373";
      ctx.fillRect(screenX - 10, screenY - 8, 20, 16);
      ctx.fillStyle = "#c78d3d";
      ctx.fillRect(screenX - 8, screenY + 8, 16, 10);
      ctx.fillStyle = "#a66b2a";
      ctx.fillRect(screenX - 8, screenY + 18 + legOffsetY, 7, 18 - legOffsetY);
      ctx.fillRect(screenX + 1, screenY + 18 + (player.walkFrame === 0 ? 0 : -2), 7, 18 + (player.walkFrame === 0 ? 0 : 2));
      ctx.fillStyle = "#7d4b1b";
      ctx.fillRect(screenX - 9, screenY + 35, 8, 4);
      ctx.fillRect(screenX + 1, screenY + 35, 8, 4);

      ctx.fillStyle = "#e6b373";
      ctx.beginPath();
      ctx.ellipse(screenX, screenY - 20, 13, 17, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(screenX - 11, screenY - 31); ctx.lineTo(screenX - 7, screenY - 43); ctx.lineTo(screenX - 3, screenY - 31); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(screenX + 11, screenY - 31); ctx.lineTo(screenX + 7, screenY - 43); ctx.lineTo(screenX + 3, screenY - 31); ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#f4d7d7";
      ctx.beginPath();
      ctx.moveTo(screenX - 10, screenY - 30); ctx.lineTo(screenX - 7, screenY - 39); ctx.lineTo(screenX - 4, screenY - 30); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(screenX + 10, screenY - 30); ctx.lineTo(screenX + 7, screenY - 39); ctx.lineTo(screenX + 4, screenY - 30); ctx.closePath(); ctx.fill();

      ctx.fillStyle = "#f4d35e";
      ctx.fillRect(screenX - 16, screenY - 40, 32, 5);
      ctx.fillStyle = "#e5b700";
      for (let i = 0; i < 5; i++) {
        const x = screenX - 12 + i * 6;
        ctx.beginPath();
        ctx.moveTo(x, screenY - 40);
        ctx.lineTo(x + 3, screenY - 48);
        ctx.lineTo(x + 6, screenY - 40);
        ctx.fill();
      }
      ctx.fillStyle = "#ff5ea8";
      ctx.beginPath(); ctx.arc(screenX - 6, screenY - 39, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#4cc9f0";
      ctx.beginPath(); ctx.arc(screenX + 6, screenY - 39, 2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#1c1c1c";
      if (player.facing === "left") {
        ctx.fillRect(screenX - 8, screenY - 20, 3, 4);
        ctx.fillRect(screenX + 4, screenY - 20, 3, 4);
      } else if (player.facing === "right") {
        ctx.fillRect(screenX - 4, screenY - 20, 3, 4);
        ctx.fillRect(screenX + 8, screenY - 20, 3, 4);
      } else {
        ctx.fillRect(screenX - 6, screenY - 20, 3, 4);
        ctx.fillRect(screenX + 3, screenY - 20, 3, 4);
      }

      ctx.fillStyle = "#f9bdbd";
      ctx.beginPath();
      ctx.moveTo(screenX, screenY - 12);
      ctx.lineTo(screenX + 2, screenY - 8);
      ctx.lineTo(screenX - 2, screenY - 8);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#1c1c1c";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(screenX, screenY - 10, 4, 0, Math.PI);
      ctx.stroke();

      ctx.strokeStyle = "#1c1c1c";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(screenX - 11, screenY - 15); ctx.lineTo(screenX - 18, screenY - 14);
      ctx.moveTo(screenX - 11, screenY - 12); ctx.lineTo(screenX - 18, screenY - 9);
      ctx.moveTo(screenX + 11, screenY - 15); ctx.lineTo(screenX + 18, screenY - 14);
      ctx.moveTo(screenX + 11, screenY - 12); ctx.lineTo(screenX + 18, screenY - 9);
      ctx.stroke();

      ctx.fillStyle = "#d9ba72";
      if (player.facing === "right") {
        ctx.beginPath();
        ctx.moveTo(screenX + 18, screenY - 2);
        ctx.lineTo(screenX + 30, screenY - 18);
        ctx.stroke();
        ctx.fillStyle = "#ffd75e";
        ctx.beginPath(); ctx.arc(screenX + 30, screenY - 18, 3, 0, Math.PI * 2); ctx.fill();
      } else if (player.facing === "left") {
        ctx.beginPath();
        ctx.moveTo(screenX - 18, screenY - 2);
        ctx.lineTo(screenX - 30, screenY - 18);
        ctx.stroke();
        ctx.fillStyle = "#ffd75e";
        ctx.beginPath(); ctx.arc(screenX - 30, screenY - 18, 3, 0, Math.PI * 2); ctx.fill();
      }
    }

    function drawUI() {
      ctx.fillStyle = "rgba(11, 16, 32, 0.8)";
      ctx.fillRect(0, 0, canvas.width, 50);
      ctx.fillStyle = "#f4d35e";
      ctx.font = "bold 28px Arial";
      ctx.textAlign = "left";
      ctx.fillText("MagiK Kingdom", 20, 32);

      ctx.fillStyle = "rgba(11, 16, 32, 0.8)";
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = "#ffffff";
      ctx.font = "13px Arial";
      ctx.fillText("MOVE: WASD/Arrows  |  TALK: E  |  ATTACK: J  |  INVENTORY: I", 20, canvas.height - 12);
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMap();
      drawPlayer();
      drawUI();
    }

    let lastTime = 0;
    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.033);
      lastTime = timestamp;
      update(dt);
      drawScene();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
