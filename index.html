<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MagiK Kingdom - Phase 1</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #gameWrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
    }

    canvas {
      display: block;
      background: #1f2937;
      border: 3px solid #d4af37;
      box-shadow: 0 0 30px rgba(0,0,0,0.45);
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas" width="960" height="640"></canvas>
  </div>

  <script>
    /*
      ============================================================
      MagiK Kingdom - Phase 1 (Improved Graphics)
      ============================================================
      Enhanced version with:
      - Pokémon-style houses with roofs and doors
      - Larger, animated character sprite (32x48 pixels)
      - Better tile variety and visual polish
      - Smooth walking animations
      - Chromebook-friendly controls
      ============================================================
    */

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ============================================================
    // CONSTANTS
    // ============================================================
    const TILE = 32;
    const WORLD_COLS = 30;
    const WORLD_ROWS = 20;

    // Player dimensions (larger for Pokémon style)
    const PLAYER_WIDTH = 32;
    const PLAYER_HEIGHT = 48;

    // ============================================================
    // INPUT SYSTEM
    // ============================================================
    const keys = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key === "arrowup" || key === "w") keys.up = true;
      if (key === "arrowdown" || key === "s") keys.down = true;
      if (key === "arrowleft" || key === "a") keys.left = true;
      if (key === "arrowright" || key === "d") keys.right = true;

      if (["arrowup","arrowdown","arrowleft","arrowright"," ","w","a","s","d"].includes(key)) {
        event.preventDefault();
      }
    });

    document.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      if (key === "arrowup" || key === "w") keys.up = false;
      if (key === "arrowdown" || key === "s") keys.down = false;
      if (key === "arrowleft" || key === "a") keys.left = false;
      if (key === "arrowright" || key === "d") keys.right = false;
    });

    // ============================================================
    // MAP SYSTEM
    // ============================================================
    // Tile values:
    // 0 = grass
    // 1 = dirt/path
    // 2 = wall/roof
    // 3 = water
    // 4 = flower/grass detail
    // 5 = stone/rock
    // 6 = dark roof
    // 7 = door wood
    // 8 = tree leaves
    // 9 = tree trunk
    const map = Array.from({ length: WORLD_ROWS }, () => Array(WORLD_COLS).fill(0));

    function setTile(x, y, value) {
      if (x >= 0 && x < WORLD_COLS && y >= 0 && y < WORLD_ROWS) {
        map[y][x] = value;
      }
    }

    function paintRect(x, y, w, h, value) {
      for (let yy = y; yy < y + h; yy++) {
        for (let xx = x; xx < x + w; xx++) {
          setTile(xx, yy, value);
        }
      }
    }

    function drawHouse(baseX, baseY, width, height, hasLeftWindow = true, hasRightWindow = true) {
      // baseX, baseY is top-left of the house base (walls)
      // Paint roof (one row above)
      paintRect(baseX - 1, baseY - 2, width + 2, 2, 6); // dark roof top

      // Paint walls
      paintRect(baseX, baseY, width, height, 2); // light roof

      // Paint door in center-bottom
      const doorX = baseX + Math.floor((width - 2) / 2);
      const doorY = baseY + height - 1;
      paintRect(doorX, doorY, 2, 1, 7); // door

      // Paint side details (windows)
      if (hasLeftWindow && width >= 4) {
        setTile(baseX + 1, baseY + 1, 2); // window frame
      }
      if (hasRightWindow && width >= 4) {
        setTile(baseX + width - 2, baseY + 1, 2); // window frame
      }

      // Add chimneys as decorative blocks on roof
      setTile(baseX + 1, baseY - 2, 5);
      setTile(baseX + width - 2, baseY - 2, 5);
    }

    function createVillageMap() {
      // Fill entire map with grass
      for (let y = 0; y < WORLD_ROWS; y++) {
        for (let x = 0; x < WORLD_COLS; x++) {
          map[y][x] = 0;
        }
      }

      // Outer border walls
      paintRect(0, 0, WORLD_COLS, 1, 5);
      paintRect(0, WORLD_ROWS - 1, WORLD_COLS, 1, 5);
      paintRect(0, 0, 1, WORLD_ROWS, 5);
      paintRect(WORLD_COLS - 1, 0, 1, WORLD_ROWS, 5);

      // Main village roads
      paintRect(0, 9, WORLD_COLS, 2, 1); // horizontal road through center
      paintRect(12, 0, 2, WORLD_ROWS, 1); // vertical road
      paintRect(18, 0, 2, WORLD_ROWS, 1); // another vertical road

      // Decorative flowers scattered around
      for (let i = 0; i < 50; i++) {
        const fx = 2 + Math.floor(Math.random() * (WORLD_COLS - 4));
        const fy = 2 + Math.floor(Math.random() * (WORLD_ROWS - 4));
        if (map[fy][fx] === 0) {
          map[fy][fx] = 4;
        }
      }

      // ========== HOUSES ==========
      // House 1: Upper-left area
      drawHouse(2, 3, 7, 5);

      // House 2: Upper-middle-left
      drawHouse(15, 3, 7, 5);

      // House 3: Upper-right
      drawHouse(24, 3, 5, 5);

      // House 4: Lower-left
      drawHouse(2, 14, 7, 5);

      // House 5: Lower-middle-left (this will be the quest tent)
      drawHouse(15, 14, 7, 5);

      // House 6: Lower-right
      drawHouse(24, 14, 5, 5);

      // ========== TREES & OBSTACLES ==========
      // Tree groups for forest feel
      const trees = [
        { x: 8, y: 4, w: 3, h: 3 },
        { x: 10, y: 11, w: 3, h: 3 },
        { x: 8, y: 15, w: 3, h: 3 },
        { x: 21, y: 4, w: 3, h: 3 },
        { x: 21, y: 11, w: 3, h: 3 },
        { x: 21, y: 15, w: 3, h: 3 }
      ];

      for (const tree of trees) {
        // Tree leaves (solid blocking)
        paintRect(tree.x, tree.y, tree.w, tree.h, 8);
      }

      // Rock patches for visual interest
      const rocks = [
        { x: 6, y: 18, w: 2, h: 1 },
        { x: 20, y: 18, w: 2, h: 1 },
        { x: 27, y: 18, w: 2, h: 1 }
      ];

      for (const rock of rocks) {
        paintRect(rock.x, rock.y, rock.w, rock.h, 5);
      }

      // ========== WATER FEATURES ==========
      // Small pond areas
      paintRect(3, 18, 3, 2, 3);
      paintRect(4, 19, 2, 1, 3);

      paintRect(25, 18, 3, 2, 3);
      paintRect(26, 19, 2, 1, 3);
    }

    createVillageMap();

    function isSolidTile(x, y) {
      if (x < 0 || x >= WORLD_COLS || y < 0 || y >= WORLD_ROWS) return true;
      const tile = map[y][x];
      // Solid tiles: walls, trees, stone, water, roofs
      return tile === 2 || tile === 5 || tile === 3 || tile === 6 || tile === 8;
    }

    // ============================================================
    // PLAYER OBJECT
    // ============================================================
    const player = {
      // Position in world pixels (center of player)
      x: 7 * TILE + TILE / 2,
      y: 8 * TILE + TILE / 2,
      
      // Velocity
      vx: 0,
      vy: 0,
      
      // Movement speed (pixels per second)
      speed: 120,
      
      // Current facing direction for animation
      facing: "down",
      
      // Animation state
      walkFrame: 0, // 0 or 1 for walking animation
      isWalking: false,
      walkTimer: 0
    };

    function playerCollisionRect() {
      // Collision box is slightly smaller than visual
      const pad = 4;
      return {
        x: player.x - PLAYER_WIDTH / 2 + pad,
        y: player.y - PLAYER_HEIGHT / 2 + pad + 8, // offset for legs
        w: PLAYER_WIDTH - pad * 2,
        h: PLAYER_HEIGHT / 2
      };
    }

    function circleIntersectsRect(cx, cy, r, rect) {
      const nearestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
      const nearestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
      const dx = cx - nearestX;
      const dy = cy - nearestY;
      return (dx * dx + dy * dy) < (r * r);
    }

    function rectIntersectsRect(r1, r2) {
      return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
             r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    }

    function isBlockedAtPosition(px, py) {
      const rect = {
        x: px - PLAYER_WIDTH / 2 + 4,
        y: py - PLAYER_HEIGHT / 2 + 4 + 8,
        w: PLAYER_WIDTH - 8,
        h: PLAYER_HEIGHT / 2 - 8
      };

      // Check all potentially overlapping tiles
      const left = Math.floor((px - PLAYER_WIDTH / 2) / TILE);
      const right = Math.floor((px + PLAYER_WIDTH / 2) / TILE);
      const top = Math.floor((py - PLAYER_HEIGHT / 2) / TILE);
      const bottom = Math.floor((py + PLAYER_HEIGHT / 2) / TILE);

      for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
          if (isSolidTile(tx, ty)) {
            const tileRect = {
              x: tx * TILE,
              y: ty * TILE,
              w: TILE,
              h: TILE
            };

            if (rectIntersectsRect(rect, tileRect)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // ============================================================
    // UPDATE LOOP
    // ============================================================
    function update(dt) {
      let moveX = 0;
      let moveY = 0;

      if (keys.left) moveX = -1;
      if (keys.right) moveX = 1;
      if (keys.up) moveY = -1;
      if (keys.down) moveY = 1;

      // Determine if moving and update direction
      if (moveX !== 0 || moveY !== 0) {
        // Normalize diagonal movement
        const length = Math.hypot(moveX, moveY);
        moveX = (moveX / length) * player.speed * dt;
        moveY = (moveY / length) * player.speed * dt;

        // Update facing direction
        if (Math.abs(moveX) > Math.abs(moveY)) {
          if (moveX > 0) player.facing = "right";
          else player.facing = "left";
        } else {
          if (moveY > 0) player.facing = "down";
          else player.facing = "up";
        }

        // Try to move
        const newX = player.x + moveX;
        const newY = player.y + moveY;

        // Move X
        player.x = newX;
        if (isBlockedAtPosition(player.x, player.y)) {
          player.x -= moveX;
        }

        // Move Y
        player.y = newY;
        if (isBlockedAtPosition(player.x, player.y)) {
          player.y -= moveY;
        }

        player.isWalking = true;
        player.walkTimer += dt;
        if (player.walkTimer > 0.25) { // Switch animation frame every 0.25 seconds
          player.walkFrame = 1 - player.walkFrame;
          player.walkTimer = 0;
        }
      } else {
        player.isWalking = false;
        player.walkFrame = 0;
        player.walkTimer = 0;
      }

      // Keep player roughly inside world bounds
      player.x = Math.max(PLAYER_WIDTH / 2, Math.min(player.x, canvas.width - PLAYER_WIDTH / 2));
      player.y = Math.max(PLAYER_HEIGHT / 2, Math.min(player.y, canvas.height - PLAYER_HEIGHT / 2));
    }

    // ============================================================
    // DRAWING FUNCTIONS
    // ============================================================

    // Draw a single tile with detailed graphics
    function drawTile(x, y, tileType) {
      const px = x * TILE;
      const py = y * TILE;

      // Grass
      if (tileType === 0) {
        ctx.fillStyle = "#7bc916";
        ctx.fillRect(px, py, TILE, TILE);

        // Grass blade details
        ctx.fillStyle = "rgba(255,255,255,0.1)";
        ctx.fillRect(px + 2, py + 6, 2, 3);
        ctx.fillRect(px + 8, py + 12, 2, 3);
        ctx.fillRect(px + 20, py + 8, 2, 3);
        ctx.fillRect(px + 26, py + 18, 2, 3);

        // Slight shadow gradient
        ctx.fillStyle = "rgba(0,0,0,0.05)";
        ctx.fillRect(px, py + TILE - 8, TILE, 8);
      }

      // Dirt path
      if (tileType === 1) {
        ctx.fillStyle = "#c9a876";
        ctx.fillRect(px, py, TILE, TILE);

        // Path lines
        ctx.strokeStyle = "rgba(100,75,50,0.3)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px + 4, py + 10);
        ctx.lineTo(px + TILE - 4, py + 10);
        ctx.moveTo(px + 4, py + 20);
        ctx.lineTo(px + TILE - 4, py + 20);
        ctx.stroke();
      }

      // House wall (light)
      if (tileType === 2) {
        ctx.fillStyle = "#e8d4b8";
        ctx.fillRect(px, py, TILE, TILE);

        // Window detail
        ctx.fillStyle = "#7dd3fc";
        ctx.fillRect(px + 4, py + 6, 6, 6);
        ctx.fillRect(px + 22, py + 6, 6, 6);

        // Bricks detail
        ctx.strokeStyle = "rgba(150,120,90,0.4)";
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(px, py + 16);
        ctx.lineTo(px + TILE, py + 16);
        ctx.stroke();
      }

      // Water
      if (tileType === 3) {
        ctx.fillStyle = "#4a90e2";
        ctx.fillRect(px, py, TILE, TILE);

        // Water wave effect
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.beginPath();
        ctx.moveTo(px + 2, py + 8);
        ctx.quadraticCurveTo(px + 8, py + 4, px + 14, py + 8);
        ctx.quadraticCurveTo(px + 20, py + 12, px + TILE - 2, py + 8);
        ctx.fill();
      }

      // Grass with flower
      if (tileType === 4) {
        ctx.fillStyle = "#7bc916";
        ctx.fillRect(px, py, TILE, TILE);

        // Draw flower
        ctx.fillStyle = "#ff69b4";
        // Petals
        for (let i = 0; i < 5; i++) {
          const angle = (i / 5) * Math.PI * 2;
          const fx = px + TILE / 2 + Math.cos(angle) * 5;
          const fy = py + TILE / 2 + Math.sin(angle) * 5;
          ctx.beginPath();
          ctx.arc(fx, fy, 2, 0, Math.PI * 2);
          ctx.fill();
        }
        // Center
        ctx.fillStyle = "#ffff00";
        ctx.beginPath();
        ctx.arc(px + TILE / 2, py + TILE / 2, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Stone / Rock
      if (tileType === 5) {
        ctx.fillStyle = "#a8a8a8";
        ctx.fillRect(px, py, TILE, TILE);

        ctx.fillStyle = "#d4d4d4";
        ctx.fillRect(px + 3, py + 3, TILE - 6, TILE - 6);

        ctx.strokeStyle = "#717171";
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 2, py + 2, TILE - 4, TILE - 4);
      }

      // Dark roof
      if (tileType === 6) {
        ctx.fillStyle = "#6b4423";
        ctx.fillRect(px, py, TILE, TILE);

        // Roof tiles
        ctx.fillStyle = "#8b5a2b";
        for (let i = 0; i < 2; i++) {
          ctx.fillRect(px + 4 + i * 12, py + 4, 8, 4);
          ctx.fillRect(px + 4 + i * 12, py + 12, 8, 4);
          ctx.fillRect(px + 4 + i * 12, py + 20, 8, 4);
        }
      }

      // Door wood
      if (tileType === 7) {
        ctx.fillStyle = "#8b4513";
        ctx.fillRect(px, py, TILE, TILE);

        // Door frame
        ctx.fillStyle = "#654321";
        ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);

        // Door handle
        ctx.fillStyle = "#d4af37";
        ctx.beginPath();
        ctx.arc(px + TILE - 6, py + TILE / 2, 2, 0, Math.PI * 2);
        ctx.fill();

        // Door panels
        ctx.strokeStyle = "#654321";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px + TILE / 2, py + 3);
        ctx.lineTo(px + TILE / 2, py + TILE - 3);
        ctx.stroke();
      }

      // Tree leaves
      if (tileType === 8) {
        ctx.fillStyle = "#3a7d44";
        ctx.beginPath();
        ctx.ellipse(px + TILE / 2, py + TILE / 2, TILE / 2, TILE / 2 + 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(px + 6, py + 6, 8, 8);
      }
    }

    function drawMap() {
      for (let y = 0; y < WORLD_ROWS; y++) {
        for (let x = 0; x < WORLD_COLS; x++) {
          drawTile(x, y, map[y][x]);
        }
      }
    }

    // Draw the player character with animation
    function drawPlayer() {
      const px = player.x;
      const py = player.y;

      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.ellipse(px, py + PLAYER_HEIGHT / 2 - 2, PLAYER_WIDTH / 2 - 2, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Determine leg offset for walking animation
      let legOffsetY = 0;
      if (player.isWalking) {
        legOffsetY = player.walkFrame === 0 ? 0 : 2;
      }

      // ===== BODY =====
      // Shirt/Tunic
      ctx.fillStyle = "#3b82f6"; // Blue tunic
      ctx.fillRect(px - PLAYER_WIDTH / 2, py - 6, PLAYER_WIDTH, 20);

      // Arms
      ctx.fillStyle = "#f5b96b"; // Skin tone
      if (player.facing === "left") {
        ctx.fillRect(px - PLAYER_WIDTH / 2 - 4, py - 2, 4, 12);
      } else if (player.facing === "right") {
        ctx.fillRect(px + PLAYER_WIDTH / 2, py - 2, 4, 12);
      } else {
        ctx.fillRect(px - PLAYER_WIDTH / 2 - 2, py - 2, 4, 12);
        ctx.fillRect(px + PLAYER_WIDTH / 2 - 2, py - 2, 4, 12);
      }

      // ===== LEGS =====
      ctx.fillStyle = "#8b6914"; // Brown pants
      // Left leg
      ctx.fillRect(px - 8, py + 12 + legOffsetY, 6, 16 - legOffsetY);
      // Right leg
      ctx.fillRect(px + 2, py + 12 + (player.walkFrame === 0 ? 0 : -2), 6, 16 + (player.walkFrame === 0 ? 0 : 2));

      // ===== HEAD =====
      ctx.fillStyle = "#f5b96b"; // Skin tone
      ctx.fillRect(px - 12, py - 24, 24, 18);

      // Hair
      ctx.fillStyle = "#2d3142"; // Dark hair
      ctx.fillRect(px - 12, py - 28, 24, 7);
      // Hair spikes for personality
      ctx.fillStyle = "#1a1f2e";
      ctx.beginPath();
      ctx.moveTo(px - 6, py - 28);
      ctx.lineTo(px - 4, py - 32);
      ctx.lineTo(px - 2, py - 28);
      ctx.lineTo(px + 2, py - 33);
      ctx.lineTo(px + 6, py - 28);
      ctx.fill();

      // Eyes based on direction
      ctx.fillStyle = "#000000";
      if (player.facing === "down") {
        ctx.fillRect(px - 6, py - 18, 3, 3);
        ctx.fillRect(px + 3, py - 18, 3, 3);
      } else if (player.facing === "up") {
        ctx.fillRect(px - 6, py - 20, 3, 3);
        ctx.fillRect(px + 3, py - 20, 3, 3);
      } else if (player.facing === "left") {
        ctx.fillRect(px - 8, py - 18, 3, 3);
      } else if (player.facing === "right") {
        ctx.fillRect(px + 5, py - 18, 3, 3);
      }

      // Smile
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(px, py - 14, 4, 0, Math.PI);
      ctx.stroke();

      // ===== SWORD (held) =====
      ctx.strokeStyle = "#c9a961";
      ctx.lineWidth = 4;
      if (player.facing === "right") {
        ctx.beginPath();
        ctx.moveTo(px + 12, py - 8);
        ctx.lineTo(px + 24, py - 16);
        ctx.stroke();
        // Sword tip
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(px + 24, py - 16, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (player.facing === "left") {
        ctx.beginPath();
        ctx.moveTo(px - 12, py - 8);
        ctx.lineTo(px - 24, py - 16);
        ctx.stroke();
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(px - 24, py - 16, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Draw UI elements
    function drawUI() {
      // Top banner with title
      ctx.fillStyle = "rgba(11, 16, 32, 0.85)";
      ctx.fillRect(0, 0, canvas.width, 50);

      ctx.fillStyle = "#f4d35e";
      ctx.font = "bold 32px Arial";
      ctx.textAlign = "left";
      ctx.fillText("MagiK Kingdom", 20, 35);

      // Village name
      ctx.fillStyle = "#a0aec0";
      ctx.font = "14px Arial";
      ctx.fillText("Village of Rowan", 20, 48);

      // Bottom control panel
      ctx.fillStyle = "rgba(11, 16, 32, 0.85)";
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

      ctx.fillStyle = "#ffffff";
      ctx.font = "14px Arial";
      ctx.textAlign = "left";
      ctx.fillText("MOVE: WASD / Arrows    TALK: E    ATTACK: J    INVENTORY: I", 20, canvas.height - 12);
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawMap();
      drawPlayer();
      drawUI();
    }

    // ============================================================
    // GAME LOOP
    // ============================================================
    let lastTime = 0;

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.033);
      lastTime = timestamp;

      update(dt);
      drawScene();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
