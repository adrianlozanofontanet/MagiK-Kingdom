<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Arena de Cartas</title>
<style>
html,body{margin:0;height:100%;background:#0b0b12;display:flex;justify-content:center;align-items:center}
canvas{height:100vh;max-width:100vw;aspect-ratio:360/640;touch-action:none;background:#000}
</style></head><body><canvas id="c" width="360" height="640"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=360,H=640,AH=530,RY=265;
// b = solo ataca torres, bld = edificio, sp = hechizo, k = cuántas unidades
const CARDS=[
 {n:'Caballero',i:'🗡️',e:3,hp:300,d:40,s:.6,r:18,cd:60,k:1},
 {n:'Arquero',i:'🏹',e:3,hp:110,d:25,s:.7,r:90,cd:50,k:2},
 {n:'Gigante',i:'🗿',e:5,hp:900,d:60,s:.35,r:20,cd:80,k:1,b:1},
 {n:'Duendes',i:'👺',e:2,hp:60,d:20,s:1.2,r:14,cd:30,k:3},
 {n:'Mago',i:'🧙',e:5,hp:200,d:70,s:.5,r:80,cd:80,k:1},
 {n:'Esqueletos',i:'💀',e:1,hp:30,d:15,s:1,r:14,cd:30,k:3},
 {n:'Bola de fuego',i:'🔥',e:4,sp:1,d:250,rad:55},
 {n:'Cañón',i:'💣',e:3,hp:250,d:35,r:100,cd:40,k:1,bld:1},
 {n:'Tanque',i:'🛡️',e:4,hp:500,d:120,s:.4,r:20,cd:90,k:1},
 {n:'Dragón',i:'🐲',e:4,hp:220,d:45,s:.8,r:70,cd:55,k:1}
];
const NAMES=['Bot Gorrión','Bot Trueno','Bot Sombra','Bot Pixel','Bot Llama'];
let st='menu',sel=new Set([0,1,2,3,5,6,7,8]),G,sT=0,rival='';
const MSG=[
 '¡Bienvenido a la arena! Abajo ves tu barra de elixir (morada). Se rellena sola y sirve para jugar cartas.',
 'Abajo tienes 4 cartas. El número morado es su coste en elixir. Toca una para seleccionarla.',
 'Ahora toca en TU mitad del campo (la de abajo) para soltarla. Los hechizos se pueden lanzar en cualquier sitio.',
 '¡Genial! Las tropas atacan solas. Tus torres azules te defienden. Destruye las rojas del rival.',
 'Consejos: el Gigante solo ataca torres, el Arquero dispara de lejos y la Bola de fuego es un hechizo. Si caes tu torre del rey, pierdes. ¡Suerte!'
];
function mk(team,x,y,king){const h=king?2000:1200;return{team,x,y,hp:h,max:h,king,cd:0}}
function newGame(isTut){
 const pool=(sel.size==8&&!isTut)?[...sel]:(sel.size==8?[...sel]:[0,1,2,3,5,6,7,8]);
 const deck=pool.sort(()=>Math.random()-.5).map(i=>CARDS[i]);
 const bdeck=CARDS.map((c,i)=>i).sort(()=>Math.random()-.5).slice(0,8).map(i=>CARDS[i]);
 G={tw:[mk(0,90,420),mk(0,270,420),mk(0,180,480,1),mk(1,90,110),mk(1,270,110),mk(1,180,50,1)],
  u:[],fx:[],deck,bdeck,el:5,bel:5,sel:-1,time:180*60,botT:200,over:0,tut:isTut,step:0,bot:!isTut};
 st='game';
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawn(c,team,x,y){
 if(c.sp){
  G.fx.push({x,y,r:c.rad,l:20});
  G.u.forEach(u=>{if(u.team!=team&&Math.hypot(u.x-x,u.y-y)<c.rad)u.hp-=c.d});
  G.tw.forEach(t=>{if(t.team!=team&&Math.hypot(t.x-x,t.y-y)<c.rad+20)t.hp-=c.d*.5});
  return;
 }
 for(let i=0;i<c.k;i++)G.u.push({c,team,x:x+(i-(c.k-1)/2)*14,y:y+(i%2)*8,hp:c.hp,max:c.hp,cd:0});
}
function update(){
 if(G.tut&&[0,3,4].includes(G.step))return;
 G.time--;
 const dbl=G.time<3600?2:1;
 G.el=Math.min(10,G.el+dbl/168);
 G.bel=Math.min(10,G.bel+dbl/168);
 // IA del bot
 if(G.bot&&--G.botT<=0){
  G.botT=100+Math.random()*180;
  const hand=G.bdeck.slice(0,4).filter(c=>c.e<=G.bel);
  if(hand.length){
   const c=hand[Math.random()*hand.length|0];
   G.bel-=c.e;G.bdeck.splice(G.bdeck.indexOf(c),1);G.bdeck.push(c);
   let x=40+Math.random()*280,y=60+Math.random()*180;
   if(c.sp){
    const t=G.u.filter(u=>u.team==0);
    if(t.length){const p=t[Math.random()*t.length|0];x=p.x;y=p.y}else{x=90+Math.random()*180;y=380}
   }
   spawn(c,1,x,y);
  }
 }
 // unidades
 for(const u of G.u){
  if(u.c.bld)u.hp-=.3;
  const tws=G.tw.filter(t=>t.team!=u.team&&t.hp>0);
  let cand=tws;
  if(!u.c.b){const near=G.u.filter(o=>o.team!=u.team&&dist(u,o)<110);if(near.length)cand=near}
  let T=null,best=1e9;
  for(const o of cand){const d=dist(u,o);if(d<best){best=d;T=o}}
  if(!T)continue;
  const rad=T.c?10:24;
  if(best<=u.c.r+rad){
   if(--u.cd<=0){u.cd=u.c.cd;T.hp-=u.c.d;G.fx.push({x:T.x,y:T.y,r:6,l:6})}
  }else if(!u.c.bld){
   let tx=T.x,ty=T.y;
   const us=u.y<RY?0:1,ts=T.y<RY?0:1;
   if(us!=ts){tx=Math.abs(u.x-90)<Math.abs(u.x-270)?90:270;ty=RY+(ts?20:-20)}
   const a=Math.atan2(ty-u.y,tx-u.x);
   u.x+=Math.cos(a)*u.c.s;u.y+=Math.sin(a)*u.c.s;
  }
 }
 // torres
 for(const t of G.tw){
  if(t.hp<=0)continue;
  if(--t.cd<=0){
   let T=null,b=t.king?125:115;
   for(const o of G.u)if(o.team!=t.team){const d=dist(t,o);if(d<b){b=d;T=o}}
   if(T){T.hp-=30;t.cd=45;G.fx.push({x:T.x,y:T.y,r:5,l:6})}else t.cd=0;
  }
 }
 G.u=G.u.filter(u=>u.hp>0);
 G.fx.forEach(f=>f.l--);G.fx=G.fx.filter(f=>f.l>0);
 // final
 const kd=G.tw[2].hp<=0,kb=G.tw[5].hp<=0;
 if(kb||kd||G.time<=0){
  const cp=G.tw.filter(t=>t.team==1&&t.hp<=0).length,cb=G.tw.filter(t=>t.team==0&&t.hp<=0).length;
  const hs=q=>G.tw.filter(x=>x.team==q).reduce((a,x)=>a+Math.max(0,x.hp),0);
  let r=cp>cb?'win':cb>cp?'lose':(hs(0)>hs(1)?'win':hs(0)<hs(1)?'lose':'draw');
  if(kb&&!kd)r='win';if(kd&&!kb)r='lose';
  G.over=r;st='end';
 }
}
// ---------- dibujo ----------
function box(x,y,w,h,col,r=10){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function txt(s,x,y,sz=14,col='#fff',al='center'){g.fillStyle=col;g.font='bold '+sz+'px sans-serif';g.textAlign=al;g.textBaseline='middle';g.fillText(s,x,y)}
function hpbar(x,y,w,p){g.fillStyle='#000';g.fillRect(x,y,w,4);g.fillStyle=p>.5?'#3d3':p>.25?'#fd3':'#f33';g.fillRect(x,y,w*Math.max(0,p),4)}
function drawMenu(){
 g.fillStyle='#14142a';g.fillRect(0,0,W,H);
 txt('⚔️ ARENA DE CARTAS',180,30,22,'#fc3');
 txt('Elige 8 cartas para tu mazo ('+sel.size+'/8)',180,60,13,'#ccc');
 CARDS.forEach((c,i)=>{
  const x=15+(i%2)*170,y=85+(i/2|0)*88,on=sel.has(i);
  box(x,y,160,80,on?'#3a4a8a':'#262640');
  if(on){g.strokeStyle='#fc3';g.lineWidth=2;g.beginPath();g.roundRect(x,y,160,80,10);g.stroke()}
  txt(c.i,x+34,y+50,28);
  box(x+6,y+6,22,22,'#c2f',11);txt(c.e,x+17,y+17,12);
  txt(c.n,x+102,y+22,12);
  txt(c.sp?'Daño '+c.d:'❤️'+c.hp+' ⚔️'+c.d,x+102,y+44,10,'#bbb');
  txt(c.sp?'Hechizo':c.bld?'Edificio':c.b?'Solo torres':c.r>50?'A distancia':'Cuerpo a cuerpo',x+102,y+62,10,'#8cf');
 });
 box(15,565,100,50,'#555');txt('📖 Tutorial',65,590,13);
 box(125,565,220,50,sel.size==8?'#2a9d4a':'#444');txt('⚔️ JUGAR',235,590,18);
}
function draw(){
 g.clearRect(0,0,W,H);
 if(st=='menu')return drawMenu();
 if(st=='search'){
  g.fillStyle='#14142a';g.fillRect(0,0,W,H);
  if(sT<150)txt('Buscando rival'+'.'.repeat(1+(sT/20|0)%3),180,300,22);
  else{txt('¡Rival encontrado!',180,280,22,'#fc3');txt('🤖 '+rival,180,320,18)}
  txt('(Sin jugadores online: te toca un bot)',180,370,11,'#999');
  return;
 }
 g.fillStyle='#3a7d3a';g.fillRect(0,0,W,AH);
 g.fillStyle='rgba(80,140,255,.1)';g.fillRect(0,RY+14,W,AH-RY-14);
 g.fillStyle='#2e88c9';g.fillRect(0,RY-14,W,28);
 g.fillStyle='#8a6a3a';[90,270].forEach(x=>g.fillRect(x-22,RY-14,44,28));
 if(G.sel>=0&&!G.deck[G.sel].sp){g.strokeStyle='#fc3';g.setLineDash([6,6]);g.strokeRect(2,RY+20,W-4,AH-RY-22);g.setLineDash([])}
 for(const t of G.tw){
  if(t.hp<=0){txt('💥',t.x,t.y,24);continue}
  box(t.x-22,t.y-22,44,44,t.team?'#c33':'#36c',8);
  txt(t.king?'👑':'🏰',t.x,t.y-2,22);
  hpbar(t.x-22,t.y+26,44,t.hp/t.max);
 }
 for(const u of G.u){
  g.fillStyle=u.team?'rgba(255,0,0,.5)':'rgba(0,100,255,.5)';
  g.beginPath();g.arc(u.x,u.y,u.c.bld?14:11,0,7);g.fill();
  txt(u.c.i,u.x,u.y,u.c.bld?22:16);
  hpbar(u.x-10,u.y+14,20,u.hp/u.max);
 }
 for(const f of G.fx){g.fillStyle='rgba(255,160,0,.5)';g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.fill()}
 // HUD
 const s=Math.max(0,G.time/60|0);
 txt((s/60|0)+':'+String(s%60).padStart(2,'0'),30,14,14);
 if(G.time<3600)txt('x2 ⚡',330,14,13,'#f9f');
 // mano
 g.fillStyle='#1a1a2e';g.fillRect(0,AH,W,H-AH);
 box(10,AH+5,340,14,'#333',7);
 box(10,AH+5,Math.max(8,340*G.el/10),14,'#c2f',7);
 txt(Math.floor(G.el)+' ⚡   Siguiente: '+G.deck[4].i,180,AH+12,11);
 for(let i=0;i<4;i++){
  const c=G.deck[i],x=8+i*88,y=AH+24;
  box(x,y,80,82,G.sel==i?'#fc3':(G.el>=c.e?'#4a4a6a':'#2a2a3a'));
  txt(c.i,x+40,y+36,30);txt(c.n,x+40,y+68,11,G.sel==i?'#000':'#fff');
  box(x+3,y+3,22,22,'#c2f',11);txt(c.e,x+14,y+14,12);
 }
 // tutorial
 if(G.tut&&G.step<5){
  const pausa=[0,3,4].includes(G.step);
  if(pausa){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H)}
  box(20,170,320,pausa?130:110,'#fffbe6');
  g.fillStyle='#222';g.font='14px sans-serif';g.textAlign='center';
  const words=MSG[G.step].split(' ');let line='',ly=195;
  for(const w of words){if(g.measureText(line+w).width>290){g.fillText(line,180,ly);line='';ly+=19}line+=w+' '}
  g.fillText(line,180,ly);
  if(pausa)txt('👆 Toca para continuar',180,280,13,'#a60');
 }
 if(st=='end'){
  g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,W,H);
  txt(G.over=='win'?'🏆 ¡VICTORIA!':G.over=='lose'?'💀 DERROTA':'🤝 EMPATE',180,280,30,'#fc3');
  txt('Toca para volver al menú',180,340,14);
 }
}
// ---------- entrada ----------
cv.addEventListener('pointerdown',e=>{
 const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 click(x,y);
});
function click(x,y){
 if(st=='menu'){
  CARDS.forEach((c,i)=>{
   const cx=15+(i%2)*170,cy=85+(i/2|0)*88;
   if(x>cx&&x<cx+160&&y>cy&&y<cy+80){sel.has(i)?sel.delete(i):sel.size<8&&sel.add(i)}
  });
  if(y>565&&y<615){
   if(x<115)newGame(true);
   else if(x>125&&sel.size==8){st='search';sT=0;rival=NAMES[Math.random()*NAMES.length|0]}
  }
  return;
 }
 if(st=='search')return;
 if(st=='end'){st='menu';return}
 if(G.tut&&[0,3,4].includes(G.step)){G.step++;if(G.step==5){G.tut=false;G.bot=true}return}
 if(y>=AH+24){
  const i=Math.floor((x-8)/88);
  if(i>=0&&i<4){G.sel=G.sel==i?-1:i;if(G.tut&&G.step==1&&G.sel>=0)G.step=2}
  return;
 }
 if(G.sel>=0&&y<AH){
  const c=G.deck[G.sel];
  if(G.el<c.e)return;
  if(!c.sp&&y<RY+20)return;
  G.el-=c.e;spawn(c,0,x,y);
  G.deck.splice(G.sel,1);G.deck.push(c);G.sel=-1;
  if(G.tut&&G.step==2)G.step=3;
 }
}
function loop(){
 if(st=='search'){sT++;if(sT>230)newGame(false)}
 if(st=='game')update();
 draw();requestAnimationFrame(loop);
}
loop();
</script></body></html>
