<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MagiK Kingdom - Phase 1</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #gameWrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
    }

    canvas {
      display: block;
      background: #1f2937;
      border: 3px solid #d4af37;
      box-shadow: 0 0 30px rgba(0,0,0,0.45);
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas" width="960" height="640"></canvas>
  </div>

  <script>
    /*
      ============================================================
      MagiK Kingdom - Phase 1 (Expanded World - Prince Character)
      ============================================================
      Enhanced version with:
      - Much larger world map (50x40 tiles)
      - Prince character inspired by user's sketch (cat-like, furry prince with crown and cape)
      - Pokémon-style houses and village
      - Camera system following the player
      - Better visual details
      - Chromebook-friendly controls
      ============================================================
    */

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // ============================================================
    // CONSTANTS
    // ============================================================
    const TILE = 32;
    const WORLD_COLS = 50;
    const WORLD_ROWS = 40;

    // Player dimensions (larger for Pokémon style)
    const PLAYER_WIDTH = 40;
    const PLAYER_HEIGHT = 56;

    // Camera
    const camera = {
      x: 0,
      y: 0
    };

    // ============================================================
    // INPUT SYSTEM
    // ============================================================
    const keys = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key === "arrowup" || key === "w") keys.up = true;
      if (key === "arrowdown" || key === "s") keys.down = true;
      if (key === "arrowleft" || key === "a") keys.left = true;
      if (key === "arrowright" || key === "d") keys.right = true;

      if (["arrowup","arrowdown","arrowleft","arrowright"," ","w","a","s","d"].includes(key)) {
        event.preventDefault();
      }
    });

    document.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      if (key === "arrowup" || key === "w") keys.up = false;
      if (key === "arrowdown" || key === "s") keys.down = false;
      if (key === "arrowleft" || key === "a") keys.left = false;
      if (key === "arrowright" || key === "d") keys.right = false;
    });

    // ============================================================
    // MAP SYSTEM
    // ============================================================
    // Tile values:
    // 0 = grass
    // 1 = dirt/path
    // 2 = wall/roof
    // 3 = water
    // 4 = flower/grass detail
    // 5 = stone/rock
    // 6 = dark roof
    // 7 = door wood
    // 8 = tree leaves
    // 9 = fence
    // 10 = sign post
    // 11 = bridge wood
    const map = Array.from({ length: WORLD_ROWS }, () => Array(WORLD_COLS).fill(0));

    function setTile(x, y, value) {
      if (x >= 0 && x < WORLD_COLS && y >= 0 && y < WORLD_ROWS) {
        map[y][x] = value;
      }
    }

    function paintRect(x, y, w, h, value) {
      for (let yy = y; yy < y + h; yy++) {
        for (let xx = x; xx < x + w; xx++) {
          setTile(xx, yy, value);
        }
      }
    }

    function drawHouse(baseX, baseY, width, height) {
      // Paint roof (one row above)
      paintRect(baseX - 1, baseY - 2, width + 2, 2, 6); // dark roof top

      // Paint walls
      paintRect(baseX, baseY, width, height, 2); // light roof

      // Paint door in center-bottom
      const doorX = baseX + Math.floor((width - 2) / 2);
      const doorY = baseY + height - 1;
      paintRect(doorX, doorY, 2, 1, 7); // door

      // Window details
      if (width >= 4) {
        setTile(baseX + 1, baseY + 1, 2);
      }
      if (width >= 4) {
        setTile(baseX + width - 2, baseY + 1, 2);
      }

      // Chimneys
      setTile(baseX + 1, baseY - 2, 5);
      setTile(baseX + width - 2, baseY - 2, 5);
    }

    function drawFenceSection(startX, startY, length, direction) {
      if (direction === "horizontal") {
        for (let i = 0; i < length; i++) {
          setTile(startX + i, startY, 9);
        }
      } else {
        for (let i = 0; i < length; i++) {
          setTile(startX, startY + i, 9);
        }
      }
    }

    function createVillageMap() {
      // Fill entire map with grass
      for (let y = 0; y < WORLD_ROWS; y++) {
        for (let x = 0; x < WORLD_COLS; x++) {
          map[y][x] = 0;
        }
      }

      // ========== OUTER BORDER ==========
      paintRect(0, 0, WORLD_COLS, 1, 5);
      paintRect(0, WORLD_ROWS - 1, WORLD_COLS, 1, 5);
      paintRect(0, 0, 1, WORLD_ROWS, 5);
      paintRect(WORLD_COLS - 1, 0, 1, WORLD_ROWS, 5);

      // ========== MAIN ROADS ==========
      // Central horizontal road
      paintRect(0, 18, WORLD_COLS, 3, 1);
      
      // Vertical roads
      paintRect(15, 0, 3, WORLD_ROWS, 1);
      paintRect(32, 0, 3, WORLD_ROWS, 1);

      // Additional smaller roads for more complex layout
      paintRect(0, 8, 15, 2, 1);
      paintRect(32, 8, WORLD_COLS - 32, 2, 1);
      paintRect(0, 30, 15, 2, 1);
      paintRect(32, 30, WORLD_COLS - 32, 2, 1);

      // ========== DECORATIVE FLOWERS ==========
      for (let i = 0; i < 100; i++) {
        const fx = 2 + Math.floor(Math.random() * (WORLD_COLS - 4));
        const fy = 2 + Math.floor(Math.random() * (WORLD_ROWS - 4));
        if (map[fy][fx] === 0) {
          map[fy][fx] = 4;
        }
      }

      // ========== VILLAGE SECTION (LEFT - Upper) ==========
      // House cluster 1
      drawHouse(2, 3, 8, 5);
      drawHouse(2, 12, 8, 5);
      
      // House cluster 2
      drawHouse(11, 3, 8, 5);
      drawHouse(11, 12, 8, 5);

      // Fences around houses
      drawFenceSection(1, 2, 10, "horizontal");
      drawFenceSection(10, 2, 8, "horizontal");
      drawFenceSection(1, 2, 16, "vertical");

      // ========== VILLAGE SECTION (RIGHT - Upper) ==========
      drawHouse(35, 3, 8, 5);
      drawHouse(35, 12, 8, 5);
      
      drawHouse(44, 3, 5, 5);
      drawHouse(44, 12, 5, 5);

      // Fences
      drawFenceSection(34, 2, 10, "horizontal");
      drawFenceSection(43, 2, 8, "horizontal");

      // ========== VILLAGE SECTION (LEFT - Lower) ==========
      drawHouse(2, 33, 8, 5);
      drawHouse(11, 33, 8, 5);

      // Fences
      drawFenceSection(1, 32, 10, "horizontal");
      drawFenceSection(10, 32, 8, "horizontal");

      // ========== VILLAGE SECTION (RIGHT - Lower) ==========
      drawHouse(35, 33, 8, 5);
      drawHouse(44, 33, 5, 5);

      // Fences
      drawFenceSection(34, 32, 10, "horizontal");
      drawFenceSection(43, 32, 8, "horizontal");

      // ========== FOREST/TREE AREAS ==========
      // Forest in corners
      const forestAreas = [
        { x: 2, y: 21, w: 10, h: 10 },
        { x: 37, y: 21, w: 10, h: 10 }
      ];

      for (const area of forestAreas) {
        for (let yy = area.y; yy < area.y + area.h; yy++) {
          for (let xx = area.x; xx < area.x + area.w; xx++) {
            if (Math.random() > 0.3) {
              setTile(xx, yy, 8);
            }
          }
        }
      }

      // Individual trees
      const treeSpots = [
        [20, 5], [25, 5], [30, 5],
        [20, 35], [25, 35], [30, 35],
        [40, 23], [42, 27], [45, 30]
      ];

      for (const [tx, ty] of treeSpots) {
        paintRect(tx, ty, 2, 2, 8);
      }

      // ========== WATER FEATURES ==========
      // Ponds
      paintRect(21, 21, 4, 3, 3);
      paintRect(22, 24, 3, 2, 3);
      
      paintRect(8, 35, 2, 3, 3);

      // ========== SIGN POSTS ==========
      setTile(16, 16, 10); // Central meeting point sign
      setTile(33, 16, 10);

      // ========== ROCK PATCHES ==========
      const rockPatches = [
        { x: 4, y: 26, w: 2, h: 2 },
        { x: 39, y: 26, w: 2, h: 2 },
        { x: 22, y: 10, w: 2, h: 1 },
        { x: 25, y: 10, w: 2, h: 1 }
      ];

      for (const patch of rockPatches) {
        paintRect(patch.x, patch.y, patch.w, patch.h, 5);
      }

      // ========== BRIDGE ==========
      paintRect(22, 24, 3, 1, 11); // Simple bridge over water

      // ========== CLEARING FOR STARTING POINT ==========
      // Make a nice open area around center where player starts
      paintRect(22, 17, 4, 2, 1); // clear path
    }

    createVillageMap();

    function isSolidTile(x, y) {
      if (x < 0 || x >= WORLD_COLS || y < 0 || y >= WORLD_ROWS) return true;
      const tile = map[y][x];
      // Solid tiles: walls, trees, stone, water, roofs, fences
      return tile === 2 || tile === 5 || tile === 3 || tile === 6 || tile === 8 || tile === 9;
    }

    // ============================================================
    // PLAYER OBJECT - PRINCE WITH CAT-LIKE FEATURES
    // ============================================================
    const player = {
      // Position in world pixels (center of player)
      x: 24 * TILE + TILE / 2,
      y: 18 * TILE + TILE / 2,
      
      // Velocity
      vx: 0,
      vy: 0,
      
      // Movement speed (pixels per second)
      speed: 140,
      
      // Current facing direction for animation
      facing: "down",
      
      // Animation state
      walkFrame: 0,
      isWalking: false,
      walkTimer: 0
    };

    function playerCollisionRect() {
      const pad = 6;
      return {
        x: player.x - PLAYER_WIDTH / 2 + pad,
        y: player.y - PLAYER_HEIGHT / 2 + pad + 10,
        w: PLAYER_WIDTH - pad * 2,
        h: PLAYER_HEIGHT / 2 - 10
      };
    }

    function rectIntersectsRect(r1, r2) {
      return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
             r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    }

    function isBlockedAtPosition(px, py) {
      const rect = {
        x: px - PLAYER_WIDTH / 2 + 6,
        y: py - PLAYER_HEIGHT / 2 + 6 + 10,
        w: PLAYER_WIDTH - 12,
        h: PLAYER_HEIGHT / 2 - 14
      };

      const left = Math.floor((px - PLAYER_WIDTH / 2) / TILE);
      const right = Math.floor((px + PLAYER_WIDTH / 2) / TILE);
      const top = Math.floor((py - PLAYER_HEIGHT / 2) / TILE);
      const bottom = Math.floor((py + PLAYER_HEIGHT / 2) / TILE);

      for (let ty = top; ty <= bottom; ty++) {
        for (let tx = left; tx <= right; tx++) {
          if (isSolidTile(tx, ty)) {
            const tileRect = {
              x: tx * TILE,
              y: ty * TILE,
              w: TILE,
              h: TILE
            };

            if (rectIntersectsRect(rect, tileRect)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    // ============================================================
    // UPDATE LOOP
    // ============================================================
    function update(dt) {
      let moveX = 0;
      let moveY = 0;

      if (keys.left) moveX = -1;
      if (keys.right) moveX = 1;
      if (keys.up) moveY = -1;
      if (keys.down) moveY = 1;

      if (moveX !== 0 || moveY !== 0) {
        const length = Math.hypot(moveX, moveY);
        moveX = (moveX / length) * player.speed * dt;
        moveY = (moveY / length) * player.speed * dt;

        if (Math.abs(moveX) > Math.abs(moveY)) {
          if (moveX > 0) player.facing = "right";
          else player.facing = "left";
        } else {
          if (moveY > 0) player.facing = "down";
          else player.facing = "up";
        }

        const newX = player.x + moveX;
        const newY = player.y + moveY;

        player.x = newX;
        if (isBlockedAtPosition(player.x, player.y)) {
          player.x -= moveX;
        }

        player.y = newY;
        if (isBlockedAtPosition(player.x, player.y)) {
          player.y -= moveY;
        }

        player.isWalking = true;
        player.walkTimer += dt;
        if (player.walkTimer > 0.2) {
          player.walkFrame = 1 - player.walkFrame;
          player.walkTimer = 0;
        }
      } else {
        player.isWalking = false;
        player.walkFrame = 0;
        player.walkTimer = 0;
      }

      // Keep player inside world bounds
      player.x = Math.max(PLAYER_WIDTH / 2, Math.min(player.x, WORLD_COLS * TILE - PLAYER_WIDTH / 2));
      player.y = Math.max(PLAYER_HEIGHT / 2, Math.min(player.y, WORLD_ROWS * TILE - PLAYER_HEIGHT / 2));

      // Update camera to follow player
      camera.x = player.x - canvas.width / 2;
      camera.y = player.y - canvas.height / 2;

      // Clamp camera to world bounds
      camera.x = Math.max(0, Math.min(camera.x, WORLD_COLS * TILE - canvas.width));
      camera.y = Math.max(0, Math.min(camera.y, WORLD_ROWS * TILE - canvas.height));
    }

    // ============================================================
    // DRAWING FUNCTIONS
    // ============================================================

    function drawTile(x, y, tileType, screenX, screenY) {
      // Grass
      if (tileType === 0) {
        ctx.fillStyle = "#7bc916";
        ctx.fillRect(screenX, screenY, TILE, TILE);

        ctx.fillStyle = "rgba(255,255,255,0.1)";
        ctx.fillRect(screenX + 2, screenY + 6, 2, 3);
        ctx.fillRect(screenX + 8, screenY + 12, 2, 3);
        ctx.fillRect(screenX + 20, screenY + 8, 2, 3);

        ctx.fillStyle = "rgba(0,0,0,0.05)";
        ctx.fillRect(screenX, screenY + TILE - 8, TILE, 8);
      }

      // Dirt path
      if (tileType === 1) {
        ctx.fillStyle = "#c9a876";
        ctx.fillRect(screenX, screenY, TILE, TILE);

        ctx.strokeStyle = "rgba(100,75,50,0.3)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(screenX + 4, screenY + 10);
        ctx.lineTo(screenX + TILE - 4, screenY + 10);
        ctx.moveTo(screenX + 4, screenY + 20);
        ctx.lineTo(screenX + TILE - 4, screenY + 20);
        ctx.stroke();
      }

      // House wall
      if (tileType === 2) {
        ctx.fillStyle = "#e8d4b8";
        ctx.fillRect(screenX, screenY, TILE, TILE);

        ctx.fillStyle = "#7dd3fc";
        ctx.fillRect(screenX + 4, screenY + 6, 6, 6);
        ctx.fillRect(screenX + 22, screenY + 6, 6, 6);

        ctx.strokeStyle = "rgba(150,120,90,0.4)";
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(screenX, screenY + 16);
        ctx.lineTo(screenX + TILE, screenY + 16);
        ctx.stroke();
      }

      // Water
      if (tileType === 3) {
        ctx.fillStyle = "#4a90e2";
        ctx.fillRect(screenX, screenY, TILE, TILE);

        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.beginPath();
        ctx.moveTo(screenX + 2, screenY + 8);
        ctx.quadraticCurveTo(screenX + 8, screenY + 4, screenX + 14, screenY + 8);
        ctx.quadraticCurveTo(screenX + 20, screenY + 12, screenX + TILE - 2, screenY + 8);
        ctx.fill();
      }

      // Grass with flower
      if (tileType === 4) {
        ctx.fillStyle = "#7bc916";
        ctx.fillRect(screenX, screenY, TILE, TILE);

        ctx.fillStyle = "#ff69b4";
        for (let i = 0; i < 5; i++) {
          const angle = (i / 5) * Math.PI * 2;
          const fx = screenX + TILE / 2 + Math.cos(angle) * 5;
          const fy = screenY + TILE / 2 + Math.sin(angle) * 5;
          ctx.beginPath();
          ctx.arc(fx, fy, 2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = "#ffff00";
        ctx.beginPath();
        ctx.arc(screenX + TILE / 2, screenY + TILE / 2, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Stone
      if (tileType === 5) {
        ctx.fillStyle = "#a8a8a8";
        ctx.fillRect(screenX, screenY, TILE, TILE);

        ctx.fillStyle = "#d4d4d4";
        ctx.fillRect(screenX + 3, screenY + 3, TILE - 6, TILE - 6);

        ctx.strokeStyle = "#717171";
        ctx.lineWidth = 1;
        ctx.strokeRect(screenX + 2, screenY + 2, TILE - 4, TILE - 4);
      }

      // Dark roof
      if (tileType === 6) {
        ctx.fillStyle = "#6b4423";
        ctx.fillRect(screenX, screenY, TILE, TILE);

        ctx.fillStyle = "#8b5a2b";
        for (let i = 0; i < 2; i++) {
          ctx.fillRect(screenX + 4 + i * 12, screenY + 4, 8, 4);
          ctx.fillRect(screenX + 4 + i * 12, screenY + 12, 8, 4);
          ctx.fillRect(screenX + 4 + i * 12, screenY + 20, 8, 4);
        }
      }

      // Door
      if (tileType === 7) {
        ctx.fillStyle = "#8b4513";
        ctx.fillRect(screenX, screenY, TILE, TILE);

        ctx.fillStyle = "#654321";
        ctx.fillRect(screenX + 2, screenY + 2, TILE - 4, TILE - 4);

        ctx.fillStyle = "#d4af37";
        ctx.beginPath();
        ctx.arc(screenX + TILE - 6, screenY + TILE / 2, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#654321";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(screenX + TILE / 2, screenY + 3);
        ctx.lineTo(screenX + TILE / 2, screenY + TILE - 3);
        ctx.stroke();
      }

      // Tree leaves
      if (tileType === 8) {
        ctx.fillStyle = "#3a7d44";
        ctx.beginPath();
        ctx.ellipse(screenX + TILE / 2, screenY + TILE / 2, TILE / 2, TILE / 2 + 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(screenX + 6, screenY + 6, 8, 8);
      }

      // Fence
      if (tileType === 9) {
        ctx.fillStyle = "#8b6914";
        ctx.fillRect(screenX + 2, screenY + 6, TILE - 4, 4);
        ctx.fillRect(screenX + 8, screenY + 2, 4, TILE - 4);
        ctx.fillRect(screenX + 20, screenY + 2, 4, TILE - 4);
      }

      // Sign post
      if (tileType === 10) {
        ctx.fillStyle = "#8b6914";
        ctx.fillRect(screenX + 12, screenY + 20, 8, 12);

        ctx.fillStyle = "#d4af37";
        ctx.fillRect(screenX + 6, screenY + 4, 20, 12);

        ctx.fillStyle = "#000000";
        ctx.font = "8px Arial";
        ctx.fillText("INN", screenX + 10, screenY + 12);
      }

      // Bridge
      if (tileType === 11) {
        ctx.fillStyle = "#8b6914";
        ctx.fillRect(screenX, screenY, TILE, TILE);

        ctx.fillStyle = "#a0791a";
        ctx.fillRect(screenX + 2, screenY + 8, TILE - 4, 4);
        ctx.fillRect(screenX + 8, screenY + 2, 4, TILE - 4);
      }
    }

    function drawMap() {
      const startCol = Math.floor(camera.x / TILE);
      const startRow = Math.floor(camera.y / TILE);
      const endCol = Math.ceil((camera.x + canvas.width) / TILE);
      const endRow = Math.ceil((camera.y + canvas.height) / TILE);

      for (let y = startRow; y < endRow; y++) {
        for (let x = startCol; x < endCol; x++) {
          if (x >= 0 && x < WORLD_COLS && y >= 0 && y < WORLD_ROWS) {
            const screenX = x * TILE - camera.x;
            const screenY = y * TILE - camera.y;
            drawTile(x, y, map[y][x], screenX, screenY);
          }
        }
      }
    }

    // Draw the Prince character inspired by the user's sketch
    function drawPlayer() {
      const screenX = player.x - camera.x;
      const screenY = player.y - camera.y;

      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.beginPath();
      ctx.ellipse(screenX, screenY + PLAYER_HEIGHT / 2 - 2, PLAYER_WIDTH / 2 - 2, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      let legOffsetY = 0;
      if (player.isWalking) {
        legOffsetY = player.walkFrame === 0 ? 0 : 2;
      }

      // ===== BODY =====
      // Cape (behind body)
      ctx.fillStyle = "rgba(255, 20, 147, 0.7)"; // Hot pink cape
      ctx.beginPath();
      ctx.moveTo(screenX - 12, screenY - 8);
      ctx.lineTo(screenX - 18, screenY + 8);
      ctx.lineTo(screenX + 18, screenY + 8);
      ctx.lineTo(screenX + 12, screenY - 8);
      ctx.fill();

      ctx.strokeStyle = "rgba(200, 10, 120, 0.8)";
      ctx.lineWidth = 1;
      ctx.stroke();

      // Royal tunic with gold trim
      ctx.fillStyle = "#ff1493"; // Deep pink tunic
      ctx.fillRect(screenX - 12, screenY - 6, 24, 24);

      // Gold trim on tunic
      ctx.fillStyle = "#d4af37";
      ctx.fillRect(screenX - 12, screenY - 6, 24, 2); // top trim
      ctx.fillRect(screenX - 12, screenY + 18, 24, 2); // bottom trim

      // Arms (furry texture)
      ctx.fillStyle = "#d2a679"; // Fur color
      if (player.facing === "left") {
        ctx.fillRect(screenX - 16, screenY - 2, 5, 14);
        ctx.fillRect(screenX + 11, screenY - 2, 5, 14);
      } else if (player.facing === "right") {
        ctx.fillRect(screenX + 11, screenY - 2, 5, 14);
        ctx.fillRect(screenX - 16, screenY - 2, 5, 14);
      } else {
        ctx.fillRect(screenX - 16, screenY - 2, 5, 14);
        ctx.fillRect(screenX + 11, screenY - 2, 5, 14);
      }

      // ===== LEGS =====
      ctx.fillStyle = "#d2a679"; // Furry legs
      // Left leg
      ctx.fillRect(screenX - 8, screenY + 16 + legOffsetY, 7, 18 - legOffsetY);
      // Right leg
      ctx.fillRect(screenX + 1, screenY + 16 + (player.walkFrame === 0 ? 0 : -2), 7, 18 + (player.walkFrame === 0 ? 0 : 2));

      // Feet
      ctx.fillStyle = "#8b6f47";
      ctx.fillRect(screenX - 9, screenY + 34, 8, 4);
      ctx.fillRect(screenX + 1, screenY + 34, 8, 4);

      // ===== HEAD =====
      ctx.fillStyle = "#d2a679"; // Fur color (cat-like)

      // Main head shape (rounder, cat-like)
      ctx.beginPath();
      ctx.ellipse(screenX, screenY - 20, 14, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      // ===== EARS (CAT-LIKE) =====
      // Left ear
      ctx.fillStyle = "#d2a679";
      ctx.beginPath();
      ctx.moveTo(screenX - 12, screenY - 32);
      ctx.lineTo(screenX - 8, screenY - 44);
      ctx.lineTo(screenX - 6, screenY - 32);
      ctx.fill();

      // Ear inner
      ctx.fillStyle = "#ffb6c1";
      ctx.beginPath();
      ctx.moveTo(screenX - 10, screenY - 32);
      ctx.lineTo(screenX - 8, screenY - 40);
      ctx.lineTo(screenX - 7, screenY - 32);
      ctx.fill();

      // Right ear
      ctx.fillStyle = "#d2a679";
      ctx.beginPath();
      ctx.moveTo(screenX + 12, screenY - 32);
      ctx.lineTo(screenX + 8, screenY - 44);
      ctx.lineTo(screenX + 6, screenY - 32);
      ctx.fill();

      // Ear inner
      ctx.fillStyle = "#ffb6c1";
      ctx.beginPath();
      ctx.moveTo(screenX + 10, screenY - 32);
      ctx.lineTo(screenX + 8, screenY - 40);
      ctx.lineTo(screenX + 7, screenY - 32);
      ctx.fill();

      // ===== CROWN =====
      ctx.fillStyle = "#ffd700"; // Gold crown
      ctx.fillRect(screenX - 16, screenY - 36, 32, 5);

      // Crown points
      ctx.fillStyle = "#ffed4e"; // Light gold
      for (let i = 0; i < 5; i++) {
        const crownX = screenX - 12 + i * 6;
        ctx.beginPath();
        ctx.moveTo(crownX, screenY - 36);
        ctx.lineTo(crownX + 2, screenY - 44);
        ctx.lineTo(crownX + 4, screenY - 36);
        ctx.fill();
      }

      // Crown gems
      ctx.fillStyle = "#ff1493";
      ctx.beginPath();
      ctx.arc(screenX - 4, screenY - 36, 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#00bfff";
      ctx.beginPath();
      ctx.arc(screenX + 4, screenY - 36, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // ===== FACE =====
      // Eyes based on direction
      ctx.fillStyle = "#000000";
      if (player.facing === "down") {
        ctx.fillRect(screenX - 6, screenY - 20, 3, 4);
        ctx.fillRect(screenX + 3, screenY - 20, 3, 4);
      } else if (player.facing === "up") {
        ctx.fillRect(screenX - 6, screenY - 24, 3, 4);
        ctx.fillRect(screenX + 3, screenY - 24, 3, 4);
      } else if (player.facing === "left") {
        ctx.fillRect(screenX - 8, screenY - 20, 3, 4);
      } else if (player.facing === "right") {
        ctx.fillRect(screenX + 5, screenY - 20, 3, 4);
      }

      // Eyes shine
      ctx.fillStyle = "#ffffff";
      if (player.facing === "down") {
        ctx.fillRect(screenX - 5, screenY - 19, 1, 2);
        ctx.fillRect(screenX + 4, screenY - 19, 1, 2);
      }

      // Whiskers
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1;
      if (player.facing === "down" || player.facing === "up") {
        ctx.beginPath();
        ctx.moveTo(screenX - 10, screenY - 16);
        ctx.lineTo(screenX - 16, screenY - 14);
        ctx.moveTo(screenX - 10, screenY - 12);
        ctx.lineTo(screenX - 16, screenY - 14);
        
        ctx.moveTo(screenX + 10, screenY - 16);
        ctx.lineTo(screenX + 16, screenY - 14);
        ctx.moveTo(screenX + 10, screenY - 12);
        ctx.lineTo(screenX + 16, screenY - 14);
        ctx.stroke();
      }

      // Nose
      ctx.fillStyle = "#ffb6c1";
      ctx.beginPath();
      ctx.moveTo(screenX - 1, screenY - 12);
      ctx.lineTo(screenX + 1, screenY - 12);
      ctx.lineTo(screenX, screenY - 10);
      ctx.fill();

      // Smile
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(screenX, screenY - 8, 4, 0, Math.PI);
      ctx.stroke();

      // ===== WEAPON/STAFF =====
      ctx.strokeStyle = "#c9a961";
      ctx.lineWidth = 3;
      if (player.facing === "right") {
        ctx.beginPath();
        ctx.moveTo(screenX + 14, screenY);
        ctx.lineTo(screenX + 26, screenY - 12);
        ctx.stroke();

        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(screenX + 26, screenY - 12, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (player.facing === "left") {
        ctx.beginPath();
        ctx.moveTo(screenX - 14, screenY);
        ctx.lineTo(screenX - 26, screenY - 12);
        ctx.stroke();

        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(screenX - 26, screenY - 12, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawUI() {
      // Dark overlay for UI
      ctx.fillStyle = "rgba(11, 16, 32, 0.8)";
      ctx.fillRect(0, 0, canvas.width, 50);

      ctx.fillStyle = "#f4d35e";
      ctx.font = "bold 28px Arial";
      ctx.textAlign = "left";
      ctx.fillText("MagiK Kingdom", 20, 32);

      // Bottom control panel
      ctx.fillStyle = "rgba(11, 16, 32, 0.8)";
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

      ctx.fillStyle = "#ffffff";
      ctx.font = "13px Arial";
      ctx.fillText("MOVE: WASD/Arrows  |  TALK: E  |  ATTACK: J  |  INVENTORY: I", 20, canvas.height - 12);
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawMap();
      drawPlayer();
      drawUI();
    }

    // ============================================================
    // GAME LOOP
    // ============================================================
    let lastTime = 0;

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.033);
      lastTime = timestamp;

      update(dt);
      drawScene();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
