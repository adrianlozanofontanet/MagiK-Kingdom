let K = 3;                 // zoom: píxeles de pantalla por cada píxel del juego
let zoomManual = 0;        // 0 = automático; con + y - lo cambias a mano

function resize() {
  K = zoomManual || Math.max(2, Math.round(innerHeight / 256));
  W = Math.ceil(innerWidth / K);
  H = Math.ceil(innerHeight / K);
  canvas.width = W; canvas.height = H;
  g.imageSmoothingEnabled = false;
  canvas.style.width = (W * K) + 'px'; canvas.style.height = (H * K) + 'px';
  ui.width = W * K; ui.height = H * K;
  ui.style.width = (W * K) + 'px'; ui.style.height = (H * K) + 'px';
}
addEventListener('resize', resize);

const fontFor = sc => 'bold ' + (9 * sc) + 'px ' + TFONT;
const tctx = document.createElement('canvas').getContext('2d');
function textW(s) { tctx.font = fontFor(1); return tctx.measureText(s).width; }
const tq = [];
function ptext(s, x, y, color, clip, sc) { tq.push({ s, x, y, color, clip, sc: sc || 1, a: g.globalAlpha }); }
function stext(s, x, y, color, sc) {
  ptext(s, x + (sc || 1), y + (sc || 1), '#000000', undefined, sc);
  ptext(s, x, y, color, undefined, sc);
}
function flushText() {
  u.setTransform(1, 0, 0, 1, 0, 0); u.clearRect(0, 0, ui.width, ui.height);
  u.setTransform(K, 0, 0, K, 0, 0);
  u.textBaseline = 'top';
  for (const t of tq) {
    u.globalAlpha = t.a; u.font = fontFor(t.sc); u.fillStyle = t.color;
    if (t.clip !== undefined && t.clip !== null) {
      u.save(); u.beginPath(); u.rect(t.x, t.y - 2, Math.max(0, t.clip), 16 * t.sc); u.clip();
      u.fillText(t.s, t.x + 1, t.y); u.restore();
    } else u.fillText(t.s, t.x + 1, t.y);
  }
  u.globalAlpha = 1; tq.length = 0;
}
function wrapText(text, maxW) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (textW(t) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

function outline(c, rgb) {
  rgb = rgb || [26, 18, 32];
  const x = c.getContext('2d'), w = c.width, h = c.height;
  const d = x.getImageData(0, 0, w, h).data;
  const out = x.createImageData(w, h), o = out.data;
  const solid = (a, b) => a >= 0 && b >= 0 && a < w && b < h && d[(b * w + a) * 4 + 3] > 0;
  for (let y = 0; y < h; y++) {
    for (let xx = 0; xx < w; xx++) {
      const i = (y * w + xx) * 4;
      if (d[i + 3] > 0) {
        o[i] = d[i]; o[i+1] = d[i+1]; o[i+2] = d[i+2]; o[i+3] = 255;
      } else if (solid(xx+1,y) || solid(xx-1,y) || solid(xx,y+1) || solid(xx,y-1)) {
        o[i] = rgb[0]; o[i+1] = rgb[1]; o[i+2] = rgb[2]; o[i+3] = 255;
      }
    }
  }
  x.putImageData(out, 0, 0);
}
function flip(c) {
  const f = document.createElement('canvas');
  f.width = c.width; f.height = c.height;
  const x = f.getContext('2d');
  x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
  return f;
}
function hash(x, y) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

function drawFront(R, pose, f) {

// Pierna de perfil: SOLO se ve una (la más cercana). La punta de la bota mira a la izquierda.

function sideLeg(R, pose, worn) {
  const boot = (x, y, w) => {
    R(x, y, w, 2, C.boot); R(x, y + 1, w, 1, C.bootD);
    if (worn) { R(x, y, 1, 1, C.sock); R(x, y + 1, 2, 1, C.skin); }
  };
  if (pose === 0) { R(7,20,2,2,C.sock); boot(5,22,4); }
  else if (pose === 1) { R(7,20,2,1,C.sock); R(6,21,2,1,C.sock); boot(3,22,4); }
  else if (pose === 2) { R(7,20,2,1,C.sock); R(8,21,2,1,C.sock); boot(9,21,3); }
  else { R(7,20,2,1,C.sock); boot(5,21,4); }
}

  R(14,9,1,1,C.hilt); R(14,10,1,2,C.scab); R(13,12,3,1,C.hilt);

  R(5,1,6,1,C.hair); R(4,2,9,3,C.hair);
  R(9,5,4,6,C.hair);
  R(5,5,4,5,C.skin); R(4,7,1,1,C.skin);
  R(5,5,3,1,C.hair);
  R(6,7,1,2,C.eye); R(5,9,1,1,C.skinD);

const spriteCache = {};
function getSprite(dir, pose, flame) {
  const key = dir + pose + flame;
  if (spriteCache[key]) return spriteCache[key];
  const c = document.createElement('canvas');
  c.width = 18; c.height = 26;
  const x = c.getContext('2d');
  const R = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a + 1, b + 1, w, h); };
  if (dir === 'down') drawFront(R, pose, flame);
  else if (dir === 'up') drawBack(R, pose, flame);
  else drawSide(R, pose, flame, dir === 'right');
  outline(c);
  return (spriteCache[key] = (dir === 'right') ? flip(c) : c);
}
function npcSprite(kind, f) {
  const key = kind + f;
  if (spriteCache[key]) return spriteCache[key];
  const c = document.createElement('canvas');
  c.width = 18; c.height = 26;
  const x = c.getContext('2d');
  const R = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a + 1, b + 1, w, h); };
  if (kind === 'sage') drawSage(R, f); else drawRaccoon(R, f);
  outline(c);
  return (spriteCache[key] = c);
}

}

const GROUND = new Set(['.', 'f', 'G', 'Gb', 'S', 'P', 'sd', 'fn']);
const isGrassy = t => t === '.' || t === 'f' || t === 'G' || t === 'Gb';
function tileImg(w, x, y) {
  const t = w.grid[y][x];
  if (t === '.') return TILES['g' + (hash(x, y) % 3)];
  if (t === 'f') return TILES['f' + (hash(x, y) % 3)];
  if (t === 'W' || t === 'Wo' || t === 'RF') return TILES.W0;
  return TILES[t];
}
function castKind(t) {
  if (t === 'T' || t === 'PT' || t === 'AZ') return 'tree';
  if (t === 'O' || t === 'F' || t === 'N' || t === 'rk' || t === 'bar') return 'small';
  if (t.startsWith('rt-') || t.startsWith('rb-') || ['wl','wn','dr','sg','hs','ms'].includes(t)) return 'build';
  return null;
}
function bakeWorld(w) {
  const grid = w.grid, CC = w.cols, RR = w.rows;
  const cv = document.createElement('canvas');
  cv.width = CC * T; cv.height = RR * T;
  const m = cv.getContext('2d');
  const at = (x, y) => (x >= 0 && y >= 0 && x < CC && y < RR) ? grid[y][x] : null;
  for (let y = 0; y < RR; y++) for (let x = 0; x < CC; x++) m.drawImage(tileImg(w, x, y), x * T, y * T);
  if (w.outdoor) {
    for (let y = 0; y < RR; y++) for (let x = 0; x < CC; x++) {
      const t = grid[y][x];
      if (t !== 'S' && t !== 'P') continue;
      const dark = t === 'S' ? '#b9ae8e' : '#c6a96c', light = t === 'S' ? '#f5f0e0' : '#f0dfb0';
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx, dy]) => {
        const n = at(x + dx, y + dy);
        if (!n || !isGrassy(n)) return;
        const px = x * T, py = y * T;
        if (dy === -1) { m.fillStyle = dark; m.fillRect(px, py, 16, 1); m.fillStyle = light; m.fillRect(px, py + 1, 16, 1); }
        if (dy === 1)  { m.fillStyle = dark; m.fillRect(px, py + 15, 16, 1); m.fillStyle = light; m.fillRect(px, py + 14, 16, 1); }
        if (dx === -1) { m.fillStyle = dark; m.fillRect(px, py, 1, 16); m.fillStyle = light; m.fillRect(px + 1, py, 1, 16); }
        if (dx === 1)  { m.fillStyle = dark; m.fillRect(px + 15, py, 1, 16); m.fillStyle = light; m.fillRect(px + 14, py, 1, 16); }
      });
    }
    const sl = document.createElement('canvas');
    sl.width = cv.width; sl.height = cv.height;
    const sg = sl.getContext('2d');
    sg.fillStyle = '#0c1e38';
    for (let y = 0; y < RR; y++) for (let x = 0; x < CC; x++) {
      const kind = castKind(grid[y][x]);
      if (!kind) continue;
      [[0,1],[1,0],[1,1]].forEach(([dx, dy]) => {
        const tx = x + dx, ty = y + dy, n = at(tx, ty);
        if (!n || !GROUND.has(n)) return;
        sg.save(); sg.beginPath(); sg.rect(tx * T, ty * T, T, T); sg.clip();
        if (kind === 'tree') {
          const cx = x * T + 12, cy = y * T + 12;
          for (let j = -7; j <= 7; j++) {
            const hw = Math.round(11 * Math.sqrt(1 - (j / 7) * (j / 7)));
            sg.fillRect(cx - hw, cy + j, hw * 2, 1);
          }
        } else if (kind === 'small') sg.fillRect(x * T + 3, y * T + 6, T, 10);
        else sg.fillRect(x * T + 6, y * T + 6, T, T);
        sg.restore();
      });
    }
    m.globalAlpha = 0.3; m.drawImage(sl, 0, 0); m.globalAlpha = 1;
  }
  w.canvas = cv; w.mini = null;
}
function loadWorld(id, tx, ty, dir) {
  cw = WORLDS[id]; map = cw.grid; COLS = cw.cols; ROWS = cw.rows; npcs = cw.npcs; items = cw.items;
  if (!cw.canvas) bakeWorld(cw);
  mapCanvas = cw.canvas;
  P.tx = tx; P.ty = ty; P.x = tx * T; P.y = ty * T; P.moving = false; P.atk = -1;
  if (dir) P.dir = dir;

}

function getMini(w) {
  if (!w.mini) {
    const ms = Math.max(1, Math.floor(120 / Math.max(w.cols, w.rows)));      // píxeles por casilla
    const c = document.createElement('canvas');
    c.width = w.cols * ms; c.height = w.rows * ms; c.ms = ms;
    const m = c.getContext('2d');

      m.fillStyle = MINI[w.grid[y][x]] || '#78c850'; m.fillRect(x * ms, y * ms, ms, ms);

  return w.mini;
}

function snapshot() {
  const itemsBy = {};

  const pl = WORLDS.isla.palm;

function saveGame() {
  try { localStorage.setItem(SLOT_KEY(currentSlot), JSON.stringify(snapshot())); } catch (e) {}
  dirty = false; lastSave = time;
}
function readSlot(i) {
  try { const s = localStorage.getItem(SLOT_KEY(i)); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function refreshSlots() { title.slots = []; for (let i = 1; i <= 5; i++) title.slots.push(readSlot(i)); }
function applySave(s) {
  Object.assign(stats, s.stats || {}); Object.assign(inv, s.inv || {}); Object.assign(dragon, s.dragon || {});
  Object.assign(quest, s.quest || {}); Object.assign(tut, s.tut || {}); equipped = s.equipped || 'espada';
  regrow.length = 0;
  (s.regrow || []).forEach(e => {
    const w = WORLDS[e.w];
    if (!w) return;
    regrow.push(e);
    if (w.grid[e.y][e.x] === 'G') w.grid[e.y][e.x] = 'Gb';
  });
  Object.keys(treeNext).forEach(k => delete treeNext[k]);
  Object.assign(treeNext, s.treeNext || {});
  for (const id in WORLDS) {
    WORLDS[id].items = ((s.items && s.items[id]) || []).map(i => ({ tx: i.tx, ty: i.ty, kind: i.kind, t: 1 }));
    WORLDS[id].canvas = null;
  }
  const pl = WORLDS.isla.palm;

let reveal = null;

function startFade(cb, dur, after) { fade = { t: 0, dur: dur || 0.9, cb, did: false, after }; }

function layout() {

  const px = bx + 8, pw = w - 16;

  const fx = px + pw - 42;
  const tx = px + 9, tw = (hasP ? fx - 8 : px + pw - 9) - tx;

}
function rewrap() {

  D.text = text; D.shown = 0; D.opts = o.opts || null; D.sel = 0; D.then = o.then || null;

function kenSay(list, done) {

    const [tx, fc] = list[i++];

}

const npcAt = (x, y) => npcs.find(n => n.tx === x && n.ty === y);

function isSolid(x, y) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return true;
  if (SOLID.has(map[y][x])) return true;
  const n = npcAt(x, y);

}

const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const BASE = { right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2 };
const STEP = 0.2;

const CATS = ['ARMAS', 'OBJETOS', 'COMIDA'];
function menuItems(cat) {
  if (cat === 0) return [{ kind: 'weapon', id: 'espada', name: 'Espada de Ken', desc: 'Tu espada de siempre. Corta la hierba, golpea los árboles y suelta chispas moradas.' }];
  const l = [];
  if (cat === 1) {
    if (dragon.type) l.push({ kind: 'egg', name: 'Huevo de dragón', sub: EGG_COL[dragon.type].n, desc: 'Un huevo de dragón de ' + EGG_COL[dragon.type].n + '. Se mueve de vez en cuando. Cuídalo bien.' });
    return l;
  }
  if (inv.coco) l.push({ kind: 'food', id: 'coco', name: 'Coco', count: inv.coco, desc: 'Fruto de la palmera. Restaura 1 corazón. Pulsa E para comerlo.' });
  if (inv.manzana) l.push({ kind: 'food', id: 'manzana', name: 'Manzana', count: inv.manzana, desc: 'Una manzana jugosa. Restaura 1 corazón. Pulsa E para comerla.' });
  return l;
}
function activateItem(it) {
  if (!it) return;
  if (it.kind === 'weapon') { equipped = it.id; menu.msg = 'Llevas equipada: ' + it.name + '.'; markDirty(); }
  else if (it.kind === 'food') {
    if (stats.vida >= stats.vidaMax) menu.msg = 'Tu vida ya está completa.';
    else {
      inv[it.id]--; stats.vida++; menu.msg = '¡Qué rico! Recuperas 1 corazón.'; markDirty();
      if (menuItems(menu.cat).length === 0) { menu.focus = 'cat'; menu.idx = 0; }
    }
  } else if (it.kind === 'egg') menu.msg = 'Todavía no está listo para nacer. Cuídalo.';
}
function handleMenuKey(k, e) {
  if (e.repeat && k !== 'arrowup' && k !== 'arrowdown') return;
  const list = menuItems(menu.cat);
  if (k === 'm' || k === 'escape') {
    if (menu.focus === 'list') menu.focus = 'cat'; else { menu.open = false; markDirty(); }
    menu.msg = ''; return;
  }
  if (k === 'arrowup' || k === 'arrowdown') {
    const d = k === 'arrowup' ? -1 : 1;
    if (menu.focus === 'cat') { menu.cat = (menu.cat + d + CATS.length) % CATS.length; menu.idx = 0; }
    else if (list.length) menu.idx = (menu.idx + d + list.length) % list.length;
    menu.msg = ''; return;
  }
  if (k === 'arrowright' || k === 'e' || k === 'enter') {
    if (menu.focus === 'cat') {
      if (list.length) { menu.focus = 'list'; menu.idx = 0; menu.msg = ''; } else menu.msg = 'Todavía no tienes nada aquí.';
    } else if (k !== 'arrowright') activateItem(list[menu.idx]);
    return;
  }
  if (k === 'arrowleft' || k === 'backspace') { if (menu.focus === 'list') { menu.focus = 'cat'; menu.msg = ''; } }
}

//  CONTROLES
// ------------------------------------------------------------
let held = [];
const KEYDIR = { arrowup:'up', arrowdown:'down', arrowleft:'left', arrowright:'right' };
function handleTitleKey(k, e) {
  if (e.repeat) return;
  if (title.confirm) {
    if (k.startsWith('arrow')) title.csel = 1 - title.csel;
    else if (k === 'e' || k === 'enter') { if (title.csel === 0) newGame(title.slotSel + 1); else title.confirm = false; }
    else if (k === 'escape') title.confirm = false;
    return;
  }
  if (title.mode === 'slots') {
    if (k === 'arrowup') title.slotSel = (title.slotSel + 4) % 5;
    else if (k === 'arrowdown') title.slotSel = (title.slotSel + 1) % 5;
    else if (k === 'escape') { title.mode = 'main'; title.msg = ''; }
    else if (k === 'e' || k === 'enter') {
      const info = title.slots[title.slotSel];
      if (title.action === 'load') { if (info) loadGame(title.slotSel + 1); else title.msg = 'Esa ranura está vacía.'; }
      else if (info) { title.confirm = true; title.csel = 1; }
      else newGame(title.slotSel + 1);
    }
    return;
  }
  if (k === 'arrowup' || k === 'arrowdown') { title.sel = 1 - title.sel; title.msg = ''; }
  else if (k === 'e' || k === 'enter') {
    refreshSlots();
    if (title.sel === 0) { title.mode = 'slots'; title.action = 'new'; title.slotSel = 0; title.msg = ''; }
    else if (title.slots.some(s => s)) { title.mode = 'slots'; title.action = 'load'; title.slotSel = Math.max(0, title.slots.findIndex(s => s)); title.msg = ''; }
    else title.msg = 'Aún no hay ninguna partida guardada.';
  }
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const m = KEYDIR[k];
  if (m || k === 'backspace') e.preventDefault();
  if ((k === '+' || k === '=') && !e.repeat) { zoomManual = Math.min(6, K + 1); resize(); }
  if ((k === '-' || k === '_') && !e.repeat) { zoomManual = Math.max(2, K - 1); resize(); }
  if (fade) return;
  if (splash.on) {                                          // E, Intro o Esc saltan el logo
    if ((k === 'e' || k === 'enter' || k === 'escape') && !e.repeat && splash.t < 5.4) splash.t = 5.4;
    return;
  }
  if (title.on) { handleTitleKey(k, e); return; }
  if (k === 'escape' && cine.on) { endCine(); return; }
  if (menu.open) { handleMenuKey(k, e); return; }
  if (m) {
    if (D.active) {
      if (D.opts && D.shown >= D.total && !e.repeat) {
        if (m === 'up') D.sel = (D.sel + D.opts.length - 1) % D.opts.length;
        if (m === 'down') D.sel = (D.sel + 1) % D.opts.length;
      }
    } else if (!cine.on && !reveal && !held.includes(m)) held.push(m);
  }
  if (k === 'a' && !e.repeat && !D.active && !reveal && !cine.on) P.qA = 0.25;
  if ((k === 'e' || k === 'enter') && !e.repeat) {
    e.preventDefault();
    if (reveal) { if (reveal.t > 0.8) closeReveal(); }
    else if (D.active) pressE();
    else if (!cine.on) P.qE = 0.25;
  }
  if (k === 'm' && !e.repeat && !D.active && !reveal && !cine.on) {
    menu.open = true; menu.cat = 0; menu.focus = 'cat'; menu.idx = 0; menu.msg = ''; held = [];
  }
});
addEventListener('keyup', e => {
  const m = KEYDIR[e.key.toLowerCase()];
  if (m) held = held.filter(d => d !== m);
});
addEventListener('blur', () => { held = []; });

// ------------------------------------------------------------
//  PARTÍCULAS, FLOTANTES Y ACCIONES DE GOLPEAR
// ------------------------------------------------------------
const parts = [];
const floaters = [];
const PCOLS = ['#b44cff', '#d98cff', '#7a2fd1', '#f0c8ff'];
const LEAF = ['#3f9a34', '#7cc85a', '#2a7a28', '#b4f59a'];
function spawn(x, y, pal) {
  pal = pal || PCOLS;
  parts.push({
    x, y,
    vx: (Math.random() - 0.5) * 34, vy: (Math.random() - 0.5) * 34 - 8,
    life: 0, max: 0.35 + Math.random() * 0.4,
    c: pal[(Math.random() * pal.length) | 0], s: Math.random() < 0.3 ? 2 : 1
  });
}
function burst(x, y, pal, n) { for (let i = 0; i < n; i++) spawn(x, y, pal); }
function floater(x, y, text, color) { floaters.push({ x, y, text, color, t: 0 }); }
function swordInfo() {
  const t = P.atk / ATT;
  const u2 = t < 0.2 ? 0 : Math.min(1, (t - 0.2) / 0.45);
  const e = u2 * u2 * (3 - 2 * u2);
  return { t, u: u2, ang: BASE[P.dir] + (-1.2 + 2.4 * e) };
}

function pickup(it) {
  items.splice(items.indexOf(it), 1);
  inv[it.kind]++; markDirty();
  floater(it.tx * T + 8, it.ty * T, '+1 ' + NAMES[it.kind], '#ffffff');
  burst(it.tx * T + 8, it.ty * T + 8, ['#ffd84a', '#ffffff'], 6);
  if (it.kind === 'coco' && !tut.cocoPicked) { tut.cocoPicked = true; kenSay([[TUT.cocoPick, 'feliz']], checkTutorial); }
  else checkTutorial();
}
function cutGrass(tx, ty) {
  const n = 1 + Math.floor(Math.random() * 3);
  stats.monedas += n; markDirty();
  map[ty][tx] = 'Gb';
  regrow.push({ w: cw.id, x: tx, y: ty, at: Date.now() + GROW_MS });
  rebakeCur();
  floater(tx * T + 8, ty * T, '+' + n, '#ffd84a');
  burst(tx * T + 8, ty * T + 8, LEAF, 8);
  checkTutorial();
}
function hitPalm() {
  const p = cw.palm;
  p.shake = 0.6;
  burst(p.tx * T + 12, p.ty * T - 30, LEAF, 6);
  if (p.coco <= 0) return;
  p.coco = 0; p.next = Date.now() + GROW_MS; markDirty();
  let n = 0;
  [[0,1],[-1,1],[1,1],[-1,0],[1,0],[0,2],[-1,2],[1,2]].forEach(([dx, dy]) => {
    const x = p.tx + dx, y = p.ty + dy;
    if (n < 2 && isFreeTile(x, y)) { items.push({ tx: x, ty: y, kind: 'coco', t: 0 }); n++; }
  });
  if (!tut.cocosHint) { tut.cocosHint = true; kenSay([[TUT.cocosCaen, 'sorpresa']]); }
}
function hitTree(tx, ty) {
  burst(tx * T + 8, ty * T + 6, LEAF, 6);
  const key = cw.id + ':' + tx + ',' + ty, now = Date.now();
  if ((treeNext[key] || 0) > now) return;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const x = tx + dx, y = ty + dy;
    if (isFreeTile(x, y)) { items.push({ tx: x, ty: y, kind: 'manzana', t: 0 }); treeNext[key] = now + GROW_MS; markDirty(); return; }
  }
}
function hitTile(tx, ty) {
  const it = itemAt(tx, ty);
  if (it) { pickup(it); return; }
  const row = map[ty], t = row ? row[tx] : undefined;
  if (t === 'G') cutGrass(tx, ty);
  else if (t === 'Gb') burst(tx * T + 8, ty * T + 8, LEAF, 3);
  else if (t === 'PT') hitPalm();
  else if (t === 'T' && cw.outdoor) hitTree(tx, ty);
}

const regrow = [];
const treeNext = {};
function processRegrow() {
  const now = Date.now();
  for (let i = regrow.length - 1; i >= 0; i--) {
    const e = regrow[i];
    if (now < e.at) continue;
    const w = WORLDS[e.w];
    if (w.grid[e.y][e.x] === 'Gb') {
      w.grid[e.y][e.x] = 'G';
      if (w === cw) rebakeCur(); else w.canvas = null;
    }
    regrow.splice(i, 1);
  }
  const pl = WORLDS.isla.palm;
  if (pl.next && now >= pl.next) { pl.coco = 2; pl.next = 0; }
}

// ------------------------------------------------------------
//  ACTUALIZAR (con título, logo, menú, huevo o intro el mundo se PARA)
// ------------------------------------------------------------
function update(dt) {
  time += dt;
  if (D.active && D.shown < D.total) D.shown = Math.min(D.total, D.shown + dt * 45);
  processRegrow();
  if (fade) {
    fade.t += dt;
    if (!fade.did && fade.t >= fade.dur / 2) { fade.did = true; if (fade.cb) fade.cb(); }
    if (fade.t >= fade.dur) { const a = fade.after; fade = null; if (a) a(); }
    return;
  }
  if (splash.on) { splash.t += dt; if (splash.t >= 6.6) endSplash(); return; }
  if (title.on) { titleUpdate(dt); return; }
  if (cine.on) { cine.t += dt; cine.flash = Math.max(0, cine.flash - dt * 1.5); cineUpdate(dt); return; }
  if (reveal) { reveal.t += dt; return; }
  if (dirty && time - lastSave > 1.5) saveGame();
  if (menu.open) return;

  P.qA = Math.max(0, P.qA - dt); P.qE = Math.max(0, P.qE - dt);
  if (cw.palm && cw.palm.shake > 0) cw.palm.shake = Math.max(0, cw.palm.shake - dt);
  items.forEach(i => { i.t += dt; });
  for (let i = floaters.length - 1; i >= 0; i--) { floaters[i].t += dt; if (floaters[i].t > 1.2) floaters.splice(i, 1); }

  if (P.atk >= 0) {
    P.atk += dt;
    const s = swordInfo();
    if (!P.hit && P.atk >= ATT * 0.4) { P.hit = true; const [dx, dy] = DIRS[P.dir]; hitTile(P.tx + dx, P.ty + dy); }
    if (s.t >= 0.2 && s.t <= 0.7) {
      const ox = P.x + 8, oy = P.y + 7;
      for (let i = 0; i < 3; i++) {
        const r = i === 0 ? 14 : 6 + Math.random() * 8;
        spawn(ox + Math.cos(s.ang) * r, oy + Math.sin(s.ang) * r);
      }
    }
    if (P.atk >= ATT) P.atk = -1;
  }

  if (P.moving) {
    P.t += dt / STEP;
    if (P.t >= 1) {
      P.moving = false; P.x = P.gx; P.y = P.gy;
      P.tx = Math.round(P.x / T); P.ty = Math.round(P.y / T);
      if (!cw.outdoor && map[P.ty][P.tx] === 'mt') exitHouse();
      checkExits();
    } else {
      P.x = P.fx + (P.gx - P.fx) * P.t;
      P.y = P.fy + (P.gy - P.fy) * P.t;
    }
  }
  if (fade) return;

  if (!P.moving && !D.active) {
    const it = itemAt(P.tx, P.ty);
    if (it && it.t > 0.4) pickup(it);
  }

  if (!P.moving && P.atk < 0 && !D.active) {
    if (P.qE > 0) { P.qE = 0; interact(); }
    else if (P.qA > 0) { P.qA = 0; P.atk = 0; P.hit = false; }
    else if (held.length) {
      const d = held[held.length - 1];
      P.dir = d;
      const [dx, dy] = DIRS[d];
      if (!isSolid(P.tx + dx, P.ty + dy)) {
        P.moving = true; P.t = 0; P.foot = 3 - P.foot;
        P.fx = P.x; P.fy = P.y;
        P.gx = (P.tx + dx) * T; P.gy = (P.ty + dy) * T;
      } else {
        const row = map[P.ty + dy], tt = row ? row[P.tx + dx] : null;
        if (tt === 'bar' && time - lastBump > 2.5) {             // la barrera mágica no deja pasar
          lastBump = time;
          kenSay([[TT.bar[Math.floor(Math.random() * TT.bar.length)], 'serio']]);
        }
      }
    }
  }

  if (!D.active && !P.moving && cw.id === 'isla' && !tut.palmHint &&
      Math.hypot(P.tx - cw.palm.tx, P.ty - cw.palm.ty) <= 3.2) {
    tut.palmHint = true; markDirty();
    kenSay([[TUT.palmera, 'sorpresa']]);
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 12 * dt;
    if (p.life >= p.max) parts.splice(i, 1);
  }
}

function isWater(x, y) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return !!cw.sea;
  const t = map[y][x];
  return t === 'W' || t === 'Wo' || t === 'RF';
}
function drawWater(x, y, t) {
  const px = x * T, py = y * T;
  g.drawImage(TILES['W' + (Math.floor(time * 1.5) % 2)], px, py);
  if (t === 'Wo') g.drawImage(TILES.WO, px, py);
  if (t === 'RF' && tut.raft) g.drawImage(TILES.RAFT, px, py + Math.round(Math.sin(time * 2)));
  const dark = '#1f5fb8', foam = '#bfe6ff';
  if (!isWater(x, y - 1)) { g.fillStyle = dark; g.fillRect(px, py, 16, 1); g.fillStyle = foam; g.fillRect(px, py + 1, 16, 1); }
  if (!isWater(x, y + 1)) { g.fillStyle = dark; g.fillRect(px, py + 15, 16, 1); g.fillStyle = foam; g.fillRect(px, py + 14, 16, 1); }
  if (!isWater(x - 1, y)) { g.fillStyle = dark; g.fillRect(px, py, 1, 16); g.fillStyle = foam; g.fillRect(px + 1, py, 1, 16); }
  if (!isWater(x + 1, y)) { g.fillStyle = dark; g.fillRect(px + 15, py, 1, 16); g.fillStyle = foam; g.fillRect(px + 14, py, 1, 16); }
}
function shadow(px, py) {
  g.fillStyle = 'rgba(12,30,56,0.32)';
  g.fillRect(px + 4, py + 12, 8, 1); g.fillRect(px + 3, py + 13, 10, 2); g.fillRect(px + 4, py + 15, 8, 1);
}
function drawSword(ang) {
  const ox = P.x + 8, oy = P.y + 7;
  const pts = [];
  for (let r = 3; r <= 13; r++) pts.push([Math.round(ox + Math.cos(ang) * r), Math.round(oy + Math.sin(ang) * r), r]);
  g.fillStyle = '#1a1220';
  pts.forEach(([x, y]) => g.fillRect(x - 1, y - 1, 4, 4));
  pts.forEach(([x, y, r]) => {
    g.fillStyle = r <= 4 ? '#6b4a2f' : r >= 12 ? '#f0c8ff' : '#dfe9ff';
    g.fillRect(x, y, 2, 2);
  });
  const gx = ox + Math.cos(ang) * 5, gy = oy + Math.sin(ang) * 5;
  g.fillStyle = '#d9b44a';
  for (let s = -2; s <= 2; s++)
    g.fillRect(Math.round(gx + Math.cos(ang + Math.PI / 2) * s), Math.round(gy + Math.sin(ang + Math.PI / 2) * s), 1, 1);
}
function drawTrail(s) {
  if (s.u <= 0 || s.u >= 1) return;
  for (let k = 1; k <= 6; k++) {
    const a = s.ang - k * 0.18;
    g.globalAlpha = 0.6 - k * 0.08;
    g.fillStyle = k < 3 ? '#d98cff' : '#8a3fe0';
    [10, 12, 14].forEach(r => g.fillRect(Math.round(P.x + 8 + Math.cos(a) * r), Math.round(P.y + 7 + Math.sin(a) * r), 2, 2));
  }

}
function drawPlayer() {
  const attacking = P.atk >= 0;
  const s = attacking ? swordInfo() : null;
  let pose = 0;
  if (!attacking && P.moving) {
    if (P.dir === 'left' || P.dir === 'right') pose = P.t < 0.45 ? 3 : (P.foot === 1 ? 1 : 2);
    else pose = P.foot;
  }
  const flame = Math.floor(time * 6) % 2;
  let dy = 0;
  if (P.moving && P.t > 0.2 && P.t < 0.8) dy = -1;
  let lx = 0, ly = 0;
  if (attacking && s.t > 0.2 && s.t < 0.65) { lx = DIRS[P.dir][0]; ly = DIRS[P.dir][1]; }
  if (attacking && P.dir === 'up' && s.t < 0.92) { drawTrail(s); drawSword(s.ang); }
  shadow(Math.round(P.x), Math.round(P.y));
  g.drawImage(getSprite(P.dir, pose, flame), Math.round(P.x) - 1 + lx, Math.round(P.y) - 9 + dy + ly);
  if (attacking && P.dir !== 'up' && s.t < 0.92) { drawTrail(s); drawSword(s.ang); }
  const gx = Math.floor((P.x + 8) / T), gy = Math.floor((P.y + 13) / T);
  if (gx >= 0 && gy >= 0 && gx < COLS && gy < ROWS && map[gy][gx] === 'G')

function camAxis(p, view, world) {

}

  for (let i = 0; i < 9; i++) { g.fillStyle = i > 6 ? '#f0c8ff' : '#dfe9ff'; g.fillRect(x + 4 + i, y + 10 - i, 2, 2); }
  g.fillStyle = '#6b4a2f'; g.fillRect(x + 2, y + 12, 2, 2); g.fillRect(x + 1, y + 13, 2, 2);
  g.fillStyle = '#d9b44a'; for (let k = -2; k <= 2; k++) g.fillRect(x + 5 + k, y + 9 + k, 1, 1);
}
function iconCoin(x, y) {
  for (let j = -5; j <= 5; j++) for (let i = -5; i <= 5; i++) {
    const d = Math.hypot(i, j);
    if (d <= 5.2) { g.fillStyle = d > 4.2 ? '#8a6a10' : '#ffd84a'; g.fillRect(x + 8 + i, y + 8 + j, 1, 1); }
  }
  g.fillStyle = '#fff6b0'; g.fillRect(x + 5, y + 5, 2, 1); g.fillRect(x + 5, y + 6, 1, 1);
  g.fillStyle = '#b08a20'; g.fillRect(x + 7, y + 6, 2, 5);
}
function bar(x, y, max, val, col) {
  for (let i = 0; i < max; i++) {
    g.fillStyle = '#1a1220'; g.fillRect(x + i * 13, y, 12, 8);
    g.fillStyle = i < val ? col : '#6a5a44'; g.fillRect(x + i * 13 + 1, y + 1, 10, 6);
    if (i < val) { g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x + i * 13 + 1, y + 1, 10, 2); }
  }
}

function drawMenu() {
  g.fillStyle = 'rgba(8,10,30,0.5)'; g.fillRect(0, 0, W, H);
  const S = 124, fw = S + 12, fh = S + 26;
  const fx = W - fw - 10, fy = 10;
  const lx = 10, ly = 10, lw = Math.max(170, fx - lx - 10), lh = H - 20;

  panel(lx, ly, lw, lh);
  let y = ly + 8;
  const st = (label, fn) => { ptext(label, lx + 8, y, '#8a2a1a'); fn(lx + 66, y); y += 15; };
  st('VIDA', (x, yy) => {
    for (let i = 0; i < stats.vidaMax; i++) heart(x + i * 11, yy + 2, i < stats.vida);
    ptext(stats.vida + '/' + stats.vidaMax, x + stats.vidaMax * 11 + 4, yy, '#3a2410');
  });
  st('MAGIA', (x, yy) => bar(x, yy + 2, stats.magiaMax, stats.magia, '#4a8af0'));
  st('FUERZA', (x, yy) => bar(x, yy + 2, stats.fuerzaMax, stats.fuerza, '#e8782a'));
  st('MONEDAS', (x, yy) => { iconCoin(x - 4, yy - 4); ptext(String(stats.monedas), x + 14, yy, '#3a2410'); });
  g.fillStyle = '#b89458'; g.fillRect(lx + 8, y, lw - 16, 1); y += 6;

  const tabW = 64, listX = lx + 8 + tabW + 8, listW = lw - (listX - lx) - 8;
  CATS.forEach((c, i) => {
    const ty = y + i * 20, sel = i === menu.cat;
    g.fillStyle = '#8a6a30'; g.fillRect(lx + 8, ty, tabW, 18);
    g.fillStyle = sel ? '#e8c870' : '#d6b878'; g.fillRect(lx + 9, ty + 1, tabW - 2, 16);
    ptext(c, lx + 20, ty + 3, sel ? '#3a2410' : '#7a5a30');
    if (sel && menu.focus === 'cat') arrow(lx + 12, ty + 5);
  });
  const list = menuItems(menu.cat);
  g.fillStyle = '#8a6a30'; g.fillRect(listX - 1, y - 1, listW + 2, 5 * 20 + 2);
  g.fillStyle = '#f2e2b4'; g.fillRect(listX, y, listW, 5 * 20);
  if (!list.length) ptext('(Vacío)', listX + 10, y + 6, '#8a7a5a');
  list.slice(0, 5).forEach((it, i) => {
    const ry = y + i * 20, sel = menu.focus === 'list' && i === menu.idx;
    if (sel) { g.fillStyle = '#ffe9a8'; g.fillRect(listX, ry, listW, 19); arrow(listX + 3, ry + 6); }
    if (it.kind === 'weapon') iconSword(listX + 10, ry + 2);
    else if (it.kind === 'egg') drawEgg(dragon.type, listX + 18, ry + 19, 1, time, false);
    else drawItemIcon(it.id, listX + 12, ry + 4);
    ptext(it.name + (it.sub ? ' · ' + it.sub : ''), listX + 30, ry + 5, '#3a2410');
    if (it.kind === 'weapon' && equipped === it.id) ptext('EQUIPADA', listX + listW - 56, ry + 5, '#2a7a28');
    if (it.count) ptext('x' + it.count, listX + listW - 24, ry + 5, '#3a2410');
    g.fillStyle = '#d6b878'; g.fillRect(listX + 4, ry + 19, listW - 8, 1);
  });
  const dy = ly + lh - 42;
  g.fillStyle = '#b89458'; g.fillRect(lx + 8, dy - 4, lw - 16, 1);
  const sel = list[menu.idx];
  const txt = menu.msg || (menu.focus === 'list' && sel ? sel.desc : 'Elige con ↑ ↓ y entra con → o E. M para cerrar.');
  wrapText(txt, lw - 24).slice(0, 3).forEach((l, i) => ptext(l, lx + 12, dy + i * 11, '#3a2410'));

  // ---- Mapa en un cuadrado a la derecha ----
  const vw = cw.outdoor ? cw : WORLDS[(returnTo && returnTo.id) || 'aldea'];
  panel(fx, fy, fw, fh);
  ptext('MAPA', fx + 8, fy + 6, '#8a2a1a');
  g.fillStyle = '#b89458'; g.fillRect(fx + 8, fy + 17, fw - 16, 1);
  const sx = fx + 6, sy = fy + 20;
  g.fillStyle = '#3a2a14'; g.fillRect(sx - 1, sy - 1, S + 2, S + 2);
  g.fillStyle = '#1c2a44'; g.fillRect(sx, sy, S, S);
  const mini = getMini(vw), ms = mini.ms;
  const mx = sx + Math.floor((S - vw.cols * ms) / 2), my = sy + Math.floor((S - vw.rows * ms) / 2);
  g.drawImage(mini, mx, my);
  const mark = (tx, ty, col) => {
    const mm = Math.max(3, ms), off = Math.floor((mm - ms) / 2);
    g.fillStyle = '#1a1220'; g.fillRect(mx + tx * ms - off - 1, my + ty * ms - off - 1, mm + 2, mm + 2);
    g.fillStyle = col; g.fillRect(mx + tx * ms - off, my + ty * ms - off, mm, mm);
  };
  if (vw.id === 'aldea') { mark(24, 14, '#ffd84a'); mark(24, 5, '#c080ff'); }
  const pos = cw.outdoor ? { x: P.tx, y: P.ty } : (cw.doorAt || { x: 24, y: 14 });
  if (Math.floor(time * 3) % 2 === 0) mark(pos.x, pos.y, '#ff3030');
  stext(worldName(vw.id), fx + 8, fy + fh + 6, '#ffffff');
  const legend = vw.id === 'aldea' ? [['#ff3030', 'Tú'], ['#ffd84a', 'Casa de misiones'], ['#c080ff', 'Casa del mago']] : [['#ff3030', 'Tú']];
  legend.forEach(([c, n], i) => {
    g.fillStyle = '#1a1220'; g.fillRect(fx + 7, fy + fh + 22 + i * 11, 5, 5);
    g.fillStyle = c; g.fillRect(fx + 8, fy + fh + 23 + i * 11, 3, 3);
    stext(n, fx + 16, fy + fh + 19 + i * 11, '#ffffff');
  });
}

function drawReveal() {
  const r = reveal;
  g.fillStyle = 'rgba(6,6,20,0.75)'; g.fillRect(0, 0, W, H);
  const s = Math.max(2, Math.min(5, Math.floor(H / 60)));
  const cx = Math.floor(W / 2), cy = Math.floor(H / 2) + 8 * s;
  const rise = Math.min(1, r.t / 0.8), ease = 1 - (1 - rise) * (1 - rise);
  const col = EGG_COL[r.type];
  g.globalAlpha = 0.10; g.fillStyle = col.g;
  for (let i = 0; i < 10; i++) {
    const a = r.t * 0.4 + i * Math.PI / 5;
    for (let d = 14 * s; d < H; d += 5) g.fillRect(Math.round(cx + Math.cos(a) * d), Math.round(cy - 9 * s + Math.sin(a) * d), 3, 3);
  }
  g.globalAlpha = 1;
  drawEgg(r.type, cx, Math.round(cy + (1 - ease) * 40), s, r.t, true);
  g.globalAlpha = ease;
  const t1 = '¡HUEVO DE DRAGÓN!', t2 = 'Tipo: ' + col.n;
  stext(t1, Math.round(cx - textW(t1)), 12, '#ffffff', 2);
  stext(t2, Math.round(cx - textW(t2) / 2), 40, col.l);
  g.globalAlpha = 1;
  if (r.t > 0.8 && Math.floor(r.t * 2.5) % 2 === 0) {
    const t3 = 'Pulsa E / Intro';
    stext(t3, Math.round(cx - textW(t3) / 2), H - 16, '#ffffff');
  }
}
function drawHud() {
  if (time < 14 && !menu.open && !D.active) {
    g.globalAlpha = time < 11 ? 1 : Math.max(0, 1 - (time - 11) / 3);
    const hint = 'Flechas · A golpear · E/Intro hablar y entrar · M menú · +/- zoom';
    stext(hint, Math.max(4, Math.round(W - textW(hint) - 8)), 6, '#ffffff');
    g.globalAlpha = 1;
  }
  if (quest.state === 1 && !menu.open) {
    const t = 'Misión: hongos brillantes';
    panel(4, 4, Math.ceil(textW(t)) + 14, 17);
    ptext(t, 11, 8, '#3a2410');
  }
}
function drawFade() {
  let a = 0;
  if (fade) {
    a = Math.max(0, Math.min(1, 1 - Math.abs(fade.t / fade.dur * 2 - 1)));
    g.globalAlpha = a; g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  }
  ui.style.opacity = String(1 - a);
}

function scene() {
  if (splash.on) { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); return; }
  if (title.on) { drawTitle(); return; }
  if (cine.on) { drawCine(); if (D.active) drawDialogue(); return; }
  const camX = camAxis(P.x + 8, W, COLS * T);
  const camY = camAxis(P.y + 8, H, ROWS * T);
  g.fillStyle = cw.bg; g.fillRect(0, 0, W, H);
  g.save();
  g.translate(-camX, -camY);

  g.drawImage(mapCanvas, 0, 0);
  for (let y = Math.max(0, Math.floor(camY / T)); y <= Math.min(ROWS - 1, Math.ceil((camY + H) / T)); y++)
    for (let x = Math.max(0, Math.floor(camX / T)); x <= Math.min(COLS - 1, Math.ceil((camX + W) / T)); x++) {
      const t = map[y][x];
      if (t === 'W' || t === 'Wo' || t === 'RF') drawWater(x, y, t);
    }
  drawItems();

  const ents = [{ y: P.y, draw: drawPlayer }];
  npcs.filter(n => n.sprite).forEach(n => ents.push({ y: n.ty * T, draw: () => drawNpc(n) }));
  if (cw.palm) ents.push({ y: cw.palm.ty * T + 10, draw: drawPalm });
  if (cw.giant) ents.push({ y: (cw.giant.ty + 1) * T + 4, draw: drawGiant });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());

  if (!D.active) {
    npcs.forEach(n => {
      if (!n.marker || !n.marker()) return;
      const ex = n.tx * T + 6, ey = n.ty * T - n.mk + Math.round(Math.sin(time * 5) * 1.5);
      g.fillStyle = '#1a1220'; g.fillRect(ex - 1, ey - 1, 4, 8); g.fillRect(ex - 1, ey + 7, 4, 4);
      g.fillStyle = '#ffd84a'; g.fillRect(ex, ey, 2, 6); g.fillRect(ex, ey + 8, 2, 2);
    });
  }
  floaters.forEach(f => {
    g.globalAlpha = f.t < 0.8 ? 1 : Math.max(0, 1 - (f.t - 0.8) / 0.4);
    stext(f.text, Math.round(f.x - textW(f.text) / 2), Math.round(f.y - f.t * 14), f.color);
  });
  g.globalAlpha = 1;
  parts.forEach(p => {
    g.globalAlpha = 1 - p.life / p.max;
    g.fillStyle = p.c;
    g.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  });
  g.globalAlpha = 1;
  g.restore();

  drawHud();
  if (D.active) drawDialogue();
  if (menu.open) drawMenu();
  if (reveal) drawReveal();
}
function render() {
  scene(); drawFade(); flushText();
  if (splash.on) drawSplashHi();            // el logo de JoyBit se dibuja a resolución real, encima
}

// ------------------------------------------------------------
//  BUCLE DEL JUEGO
// ------------------------------------------------------------
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000 || 0, 0.05);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
(function () {                                    // si tenías una partida de la versión anterior, pasa a la ranura 1
  try {
    const old = localStorage.getItem('magikkingdom_save_v1');
    if (old && !localStorage.getItem(SLOT_KEY(1))) localStorage.setItem(SLOT_KEY(1), old);
  } catch (e) {}
})();
refreshSlots();
loadWorld('isla', 18, 15, 'up');
requestAnimationFrame(loop);
</script>
</body>
